# The statements export (docs/statements.md): lean4export with tools/export/lean4export-statements.patch writes a theorem as an AXIOM of its type and does not visit its proof, so a whole tree exports in a fraction
# of the lines (the statement-only closure of the wide sample is 6 % of the terms of the full one, workflow stmt-closure). The cheap gates run first and stop the run if they fail: the patched exporter builds, and
# Init exported both ways (full, --statements) agrees on every declaration it shares (tools/export/compare_exports.py). Then the wide sample of the transplant runs is exported as statements (the same roots as the
# 1.6 GB snapshot, for an apples-to-apples size) and the whole tree is exported as statements (lines, bytes, time, memory), and a replay of each through the kernel (tengai-replay from core/) is tried as a probe:
# size of the module, what a session loads. Manual. It measures; it changes nothing.
name: export-statements
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules to import and export whole, separated by spaces (a tree: Tengoku.All)"
        required: true
        default: "Tengoku.All"
      wide_sample:
        description: "Also export a sample of the intake theorems as statements (by default the wide sample of the transplant runs: 16 libraries, 4,800 theorems, seed wide-2), for a size to set against the snapshot of the same roots: true or false"
        required: true
        default: "true"
      sample_libraries:
        description: "The intake libraries of the sample (keys of data/intake, separated by spaces), or all"
        required: true
        default: "aintlib compfiles azurite nlalib complexitylib causalean linearhadwiger leancert regularity-lemmata lie-lean formal-mathfin imoshortlist erdos-lean cslib physlib brownian-motion"
      sample_count:
        description: "How many theorems the sample takes (more than there are: all of them)"
        required: true
        default: "4800"
      sample_seed:
        description: "The sample's seed"
        required: true
        default: "wide-2"
      tree:
        description: "Also export the whole tree as statements (25 minutes and 12 GB of memory for Tengoku.All): true or false"
        required: true
        default: "true"
      replay:
        description: "After the exports, try the kernel replay of each (tengai-replay from core/) and measure the module: true or false"
        required: true
        default: "true"
      layers:
        description: "Plan the layers of the sample (a foundation, the constants more than one library needs, and one layer per library; tools/promote/layers.py): the sizes only, nothing is replayed. true or false"
        required: true
        default: "false"
      keep_export:
        description: "Keep the sample's export (zstd, with its names and topics) as an artifact, so that a later job replays it without Tengoku: no setup, no export. true or false"
        required: true
        default: "false"
      export_run:
        description: "The id of an earlier run of this workflow that kept its export (keep_export): replay that export instead of making one, with no Tengoku setup and no export (empty: make one)"
        required: false
        default: ""
      layers_replay:
        description: "With layers=true: replay the foundation and a chosen number of topics by layers (tengai-replay --only/--import) and measure what a session loads of them against the cap. true or false"
        required: true
        default: "false"
      topics_measured:
        description: "How many topics layers_replay replays and measures: the largest, the smallest and evenly spaced ranks between (as many as there are topics: all of them)"
        required: true
        default: "10"
      source_hashes:
        description: "In a run that exports (no export_run) with layers: also read, in Tengoku's environment, the hashes of the first constant of every unit of the layers (tengai-typeinfo --hashes) and keep them with the export, for the faithfulness check of a later replay. true or false"
        required: true
        default: "false"
      ext_rows:
        description: "In a run that exports (no export_run) with layers: also read, in Tengoku's environment, the extension entries of every constant of the layers (tengai-extinfo: reducibility, projections, structures, classes, instances, and the binder annotations of the source) and keep them with the export; a replay with layers_replay then puts them back (tengai-replay --ext), so that a session can elaborate with the instances and the structure notation of the source. true or false"
        required: true
        default: "false"
      scoped_instances:
        description: "With the extension entries (ext_rows of the export): register the instances as SCOPED to the namespace of each layer's module (tengai-replay --scoped-instances; a session opens the namespace of the layers it wants active: invariant I4, visible but not active) instead of global (active as soon as the layer is imported, as in the transplant flavor). true or false"
        required: true
        default: "false"
      nanoda:
        description: "With layers_replay: read the replayed layers back out of their .olean files, export them again (lean4export without our patch) and check them with nanoda, an independent kernel that shares no code with Lean (invariant I1). A theorem stands as an axiom of its type in a statements snapshot, so it checks every other declaration. true or false"
        required: true
        default: "false"
      sample_mode:
        description: "manifests (the theorems of the intake manifests, tools/promote/pick.py) or tree (every theorem of the whole tree, topics by module path: Seed/<area> and Intake/<library>, a tree for layers.py; no names file, the whole tree is exported)"
        required: true
        default: "manifests"
      seed_depth:
        description: "With sample_mode=tree: how many components below Tengoku.Seed make a topic (1: an area of the seed, 2: Seed/Algebra/Group)"
        required: true
        default: "1"
      drop_proofs:
        description: "Export the theorems as axioms of their type and keep NO proof (lean4export --drop-proofs, the first version of --statements): a much smaller export; a definition that only computes through a proof is refused by the kernel at replay and stands as an axiom of its type (--stub-refused), and is counted. true or false"
        required: true
        default: "false"
      pack:
        description: "With layers_replay and all the topics replayed: the layers index, the manifest (flavor statements), one tar compressed with zstd, verified and imported from its unpacked copy, kept as an artifact. true or false"
        required: true
        default: "false"
permissions: {}
concurrency:
  group: export-statements
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MODULES: ${{ inputs.modules }}
  REPLAY: ${{ inputs.replay }}
  LAYERS: ${{ inputs.layers }}
  KEEP_EXPORT: ${{ inputs.keep_export }}
  EXPORT_RUN: ${{ inputs.export_run }}
  LAYERS_REPLAY: ${{ inputs.layers_replay }}
  TOPICS_MEASURED: ${{ inputs.topics_measured }}
  PACK: ${{ inputs.pack }}
  DROP_PROOFS: ${{ inputs.drop_proofs }}
  SOURCE_HASHES: ${{ inputs.source_hashes }}
  EXT_ROWS: ${{ inputs.ext_rows }}
  SCOPED_INSTANCES: ${{ inputs.scoped_instances }}
  NANODA: ${{ inputs.nanoda }}
  SAMPLE_MODE: ${{ inputs.sample_mode }}
  SEED_DEPTH: ${{ inputs.seed_depth }}
  WIDE_SAMPLE: ${{ inputs.wide_sample }}
  SAMPLE_LIBS: ${{ inputs.sample_libraries }}
  SAMPLE_COUNT: ${{ inputs.sample_count }}
  SAMPLE_SEED: ${{ inputs.sample_seed }}
  TREE: ${{ inputs.tree }}
  LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c  # pragma: allowlist secret (a commit, not a secret): the commit Tengoku's independent check pins for toolchain v4.34.0-rc2
  NANODA_COMMIT: 3a2407216ee84a75f9e1aead6803d0578be06ae7  # pragma: allowlist secret (a commit, not a secret): the checker Tengoku's independent check pins (reads export format 3.1)
  GH_TOKEN: ${{ github.token }}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: read, actions: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lean4export at the pinned commit, with the --statements patch
        if: env.EXPORT_RUN == ''
        run: |
          for m in $MODULES; do [[ "$m" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "bad module $m"; exit 1; }; done
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          cd "$RUNNER_TEMP/lean4export"
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          patch -p1 < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          lake build 2>&1 | tail -3
          ls -l .lake/build/bin/lean4export
      - name: "The patch changes nothing but theorems: Init exported both ways (full, --statements) and compared declaration by declaration"
        if: env.EXPORT_RUN == ''
        run: |
          cd "$RUNNER_TEMP/lean4export"
          l4e=".lake/build/bin/lean4export"
          lake env "$l4e" Init > "$RUNNER_TEMP/init-full.ndjson" 2> "$RUNNER_TEMP/init-full.err"
          lake env "$l4e" Init --statements > "$RUNNER_TEMP/init-stmt.ndjson" 2> "$RUNNER_TEMP/init-stmt.err"
          wc -lc "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson"
          # nothing on stderr but the one line the patch prints (how many theorems are kept with their proofs)
          for f in full stmt; do
            grep -v '^lean4export --statements: ' "$RUNNER_TEMP/init-$f.err" > "$RUNNER_TEMP/init-$f.err.rest" || true
            test ! -s "$RUNNER_TEMP/init-$f.err.rest" || { echo "stderr of the $f export:"; head -20 "$RUNNER_TEMP/init-$f.err.rest"; exit 1; }
          done
          grep '^lean4export --statements: ' "$RUNNER_TEMP/init-stmt.err" | tee -a "$GITHUB_STEP_SUMMARY" || true
          cd "$GITHUB_WORKSPACE"
          { echo "### Init, full and with --statements"; echo; echo '```'; python3 tools/export/compare_exports.py "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson" --out "$RUNNER_TEMP/init-compare.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os,sys; sys.exit(0 if json.load(open(os.environ["RUNNER_TEMP"] + "/init-compare.json"))["passed"] else 1)'
      - name: The Init exports, compressed, for a look at what differs (only when the comparison failed)
        if: failure() && env.EXPORT_RUN == ''
        run: |
          mkdir -p "$RUNNER_TEMP/init-exports"
          zstd -3 -T0 -q "$RUNNER_TEMP/init-full.ndjson" -o "$RUNNER_TEMP/init-exports/init-full.ndjson.zst"
          zstd -3 -T0 -q "$RUNNER_TEMP/init-stmt.ndjson" -o "$RUNNER_TEMP/init-exports/init-stmt.ndjson.zst"
          ls -l "$RUNNER_TEMP/init-exports"
      - name: Tengoku at the pin, with its compiled cache
        if: env.EXPORT_RUN == ''
        run: scripts/tengoku-setup.sh
      - name: "The export of an earlier run (export_run), downloaded: no Tengoku, no export"
        if: env.EXPORT_RUN != ''
        run: |
          [[ "$EXPORT_RUN" =~ ^[0-9]+$ ]] || { echo "bad export_run"; exit 1; }
          gh run download "$EXPORT_RUN" --repo "$GITHUB_REPOSITORY" --name "statements-export-$EXPORT_RUN" --dir "$RUNNER_TEMP/kept"
          ls -l "$RUNNER_TEMP/kept"
          # the manifest says how the export was made, so this run must say the same as the export did (an export made before the flag existed kept its proofs)
          made="$(cat "$RUNNER_TEMP/kept/drop-proofs.txt" 2>/dev/null || echo false)"
          [ "$made" = "${DROP_PROOFS:-false}" ] || { echo "::error::the export of run $EXPORT_RUN was made with drop_proofs=$made, this run says drop_proofs=${DROP_PROOFS:-false}"; exit 1; }
          zstd -d -q "$RUNNER_TEMP/kept/sample-stmt.ndjson.zst" -o "$RUNNER_TEMP/sample-stmt.ndjson"
          for f in names.txt sample.jsonl topics.json missing-names.txt sample-stmt-stats.json attribution.json; do
            if [ -f "$RUNNER_TEMP/kept/$f" ]; then cp "$RUNNER_TEMP/kept/$f" "$RUNNER_TEMP/$f"; fi
          done
          rm -f "$RUNNER_TEMP/kept/sample-stmt.ndjson.zst"
          if [ -f "$RUNNER_TEMP/kept/source-hashes.jsonl.zst" ]; then zstd -d -q "$RUNNER_TEMP/kept/source-hashes.jsonl.zst" -o "$RUNNER_TEMP/source-hashes.jsonl"; fi
          if [ -f "$RUNNER_TEMP/kept/ext.jsonl.zst" ]; then zstd -d -q "$RUNNER_TEMP/kept/ext.jsonl.zst" -o "$RUNNER_TEMP/ext.jsonl"; fi
          ls -l "$RUNNER_TEMP/sample-stmt.ndjson" "$RUNNER_TEMP/topics.json"
          names=none; if [ -f "$RUNNER_TEMP/names.txt" ]; then names="$(wc -l < "$RUNNER_TEMP/names.txt")"; fi   # the export of a whole tree (sample_mode=tree) names nothing: it has every constant
          { echo "### The export of run $EXPORT_RUN"; echo; echo "$(wc -l < "$RUNNER_TEMP/sample-stmt.ndjson") lines, $names names, $(python3 -c 'import json,os; print(len(json.load(open(os.environ["RUNNER_TEMP"] + "/topics.json"))))') topics"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "The sample as statements (by default the wide sample of the transplant runs): the same roots, theorems as axioms unless a definition's value mentions them"
        if: env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == '' && env.SAMPLE_MODE != 'tree'
        run: |
          [[ "$SAMPLE_COUNT" =~ ^[0-9]+$ ]] || { echo "bad count"; exit 1; }
          for l in $SAMPLE_LIBS; do [[ "$l" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad library $l"; exit 1; }; done
          python3 tools/promote/pick.py --manifests .tengoku/data/intake --libraries "$SAMPLE_LIBS" --n "$SAMPLE_COUNT" --seed "$SAMPLE_SEED" --names "$RUNNER_TEMP/names.txt" --modules "$RUNNER_TEMP/export-modules.txt" --sample "$RUNNER_TEMP/sample.jsonl"
          wc -l "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/export-modules.txt"
          mapfile -t mods < "$RUNNER_TEMP/export-modules.txt"
          drop=(); if [ "$DROP_PROOFS" = true ]; then drop=(--drop-proofs); fi
          cd .tengoku
          # a sampled name that is not a constant of the tree is a PANIC line on stderr and the export goes on without it (22 of the 4,800); the names come from a file (hundreds of thousands do not fit on a command line)
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" --statements "${drop[@]}" --names-file="$RUNNER_TEMP/names.txt" > "$RUNNER_TEMP/sample-stmt.ndjson" 2> "$RUNNER_TEMP/sample-stmt.err" || { head -40 "$RUNNER_TEMP/sample-stmt.err"; exit 1; }
          grep -E "^lean4export --statements: " "$RUNNER_TEMP/sample-stmt.err" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "PANIC lines: $(grep -cE '^PANIC' "$RUNNER_TEMP/sample-stmt.err" || true)"
          cd "$GITHUB_WORKSPACE"
          python3 tools/export/export_stats.py "$RUNNER_TEMP/sample-stmt.ndjson" --time-log "$RUNNER_TEMP/sample-stmt.err" --label "The sample as statements ($(wc -l < "$RUNNER_TEMP/names.txt") theorems of $SAMPLE_LIBS, seed $SAMPLE_SEED)" --out "$RUNNER_TEMP/sample-stmt-stats.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "The whole tree as the sample (sample_mode=tree): the theorems of every module, the topics by module path, and the tree exported as statements"
        if: env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == '' && env.SAMPLE_MODE == 'tree'
        run: |
          [[ "$SEED_DEPTH" =~ ^[1-9]$ ]] || { echo "bad seed_depth"; exit 1; }
          (cd .tengoku && lake env lean --run "$GITHUB_WORKSPACE/tools/promote/Modules.lean" --prefix Tengoku Tengoku.All) > "$RUNNER_TEMP/modules.jsonl" 2> "$RUNNER_TEMP/modules.err"
          tail -1 "$RUNNER_TEMP/modules.err"
          [ -s "$RUNNER_TEMP/modules.jsonl" ] || { echo "no theorem listed"; exit 1; }
          python3 tools/promote/tree_topics.py "$RUNNER_TEMP/modules.jsonl" --out "$RUNNER_TEMP/topics.json" --sample-out "$RUNNER_TEMP/sample.jsonl" --seed-depth "$SEED_DEPTH" | tee -a "$GITHUB_STEP_SUMMARY"
          drop=(); if [ "$DROP_PROOFS" = true ]; then drop=(--drop-proofs); fi
          cd .tengoku
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" Tengoku.All --statements "${drop[@]}" > "$RUNNER_TEMP/sample-stmt.ndjson" 2> "$RUNNER_TEMP/sample-stmt.err" || { head -40 "$RUNNER_TEMP/sample-stmt.err"; exit 1; }
          grep -E "^lean4export --statements: " "$RUNNER_TEMP/sample-stmt.err" | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/sample-stmt.err" || true
          cd "$GITHUB_WORKSPACE"
          python3 tools/export/export_stats.py "$RUNNER_TEMP/sample-stmt.ndjson" --time-log "$RUNNER_TEMP/sample-stmt.err" --label "The whole tree as statements (sample_mode=tree)" --out "$RUNNER_TEMP/sample-stmt-stats.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "The sample without the names the exporter did not find, and its topics (the libraries)"
        if: (env.LAYERS == 'true' || env.KEEP_EXPORT == 'true') && env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == '' && env.SAMPLE_MODE != 'tree'
        run: |
          python3 tools/promote/missing.py --err "$RUNNER_TEMP/sample-stmt.err" --names "$RUNNER_TEMP/names.txt" --sample "$RUNNER_TEMP/sample.jsonl" --out "$RUNNER_TEMP/missing-names.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          t = os.environ["RUNNER_TEMP"]
          topics: dict[str, list[str]] = {}
          for ln in open(f"{t}/sample.jsonl", encoding="utf-8"):
              if ln.strip():
                  r = json.loads(ln)
                  topics.setdefault(r["library"], []).append(r["name"])
          json.dump(topics, open(f"{t}/topics.json", "w", encoding="utf-8"))
          print("topics:", len(topics), "libraries,", sum(len(v) for v in topics.values()), "theorems")
          PY
      - name: "Attribution: the repository, commit and licence of each library of the sample"
        if: (env.LAYERS == 'true' || env.KEEP_EXPORT == 'true') && env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == ''
        run: |
          sample_args=(--sample "$RUNNER_TEMP/sample.jsonl")
          if [ "$SAMPLE_MODE" = tree ]; then sample_args=(); fi   # the topics of a tree are not the libraries' keys: every library of the intake is listed
          python3 tools/promote/attribution.py --intake .tengoku/data/intake --sources .tengoku/schemas/sources.json "${sample_args[@]}" --out "$RUNNER_TEMP/attribution.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Layers: which layer each constant of the sample belongs to (a foundation, the constants more than one library needs, and one layer per library): the sizes only, nothing is replayed"
        if: env.LAYERS == 'true' && env.WIDE_SAMPLE == 'true'
        continue-on-error: true   # the planner reads the whole export in Python (3.1 GB for all of the intake): if it fails, the run still has its export and its replay probe
        run: |
          /usr/bin/time -v python3 tools/promote/layers.py "$RUNNER_TEMP/sample-stmt.ndjson" --topics "$RUNNER_TEMP/topics.json" --out "$RUNNER_TEMP/layers" > "$RUNNER_TEMP/layers.out" 2> "$RUNNER_TEMP/layers-time.txt" || { tail -20 "$RUNNER_TEMP/layers-time.txt"; exit 1; }
          head -1 "$RUNNER_TEMP/layers.out"
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/layers-time.txt" | tr -s '\t' ' '
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          t = os.environ["RUNNER_TEMP"]
          p = json.load(open(f"{t}/layers/layers.json", encoding="utf-8"))
          tot, layers, topics = p["totals"], p["layers"], p["topics"]
          found = next((x for x in layers if x["topic"] is None), None)
          fc = found["constants"] if found else 0
          own = sorted((x["constants"], x["topic"]) for x in layers if x["topic"] is not None)
          used = sorted(v["foundation_units_used"] for v in topics.values())
          def q(xs, f):
              return xs[min(len(xs) - 1, int(f * len(xs)))] if xs else 0
          print(f"### Layers of the sample ({len(topics)} libraries as topics)")
          print()
          print(f"{tot['units']:,} units, {tot['constants']:,} constants, {tot['terms']:,} terms in all; the units by kind: {tot['kinds']}")
          if found:
              print(f"* the foundation (used by two libraries or more): {found['units']:,} units, {fc:,} constants, {found['terms']:,} terms, {100 * fc / tot['constants']:.1f} % of the constants")
          print(f"* the topic layers (what only one library needs), constants: smallest {own[0][0]:,}, median {q([c for c, _ in own], .5):,}, 90th percentile {q([c for c, _ in own], .9):,}, largest {own[-1][0]:,} ({own[-1][1]}); together {sum(c for c, _ in own):,}")
          print(f"* a session loads the foundation and its topic: the worst is {fc + own[-1][0]:,} constants, a median one {fc + q([c for c, _ in own], .5):,}")
          print(f"* what a topic actually uses of the foundation (units): smallest {used[0]:,}, median {q(used, .5):,}, 90th percentile {q(used, .9):,}, largest {used[-1]:,} of {found['units'] if found else 0:,}: a foundation cut into shards could load less than all of it")
          print("* measured so far, cold import over an empty session: 55,316 constants +0.007 s, 612,257 constants +0.30 s (docs/statements.md); the cap is 0.25 s")
          print()
          print("| the largest topic layers | theorems | own units | foundation units used |")
          print("|---|---:|---:|---:|")
          for c, name in own[-8:][::-1]:
              v = topics[name]
              print(f"| {name} | {v['theorems']:,} | {v['own_units']:,} | {v['foundation_units_used']:,} |")
          PY
      - name: "Layers: tengai-replay by layers (the foundation first, then the topics measured, each kernel-checked on its own)"
        if: env.LAYERS == 'true' && env.LAYERS_REPLAY == 'true' && env.WIDE_SAMPLE == 'true'
        timeout-minutes: 240
        run: |
          [ -s "$RUNNER_TEMP/layers/layers.json" ] || { echo "::error::the plan of the layers failed (its step above says why)"; exit 1; }
          [[ "$TOPICS_MEASURED" =~ ^[0-9]+$ ]] || { echo "bad topics_measured"; exit 1; }
          (cd core && lake build tengai-replay 2>&1 | tail -3)
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          mkdir -p "$RUNNER_TEMP/layered"
          export LEAN_PATH="$RUNNER_TEMP/layered"
          # the layers to replay: the foundation, then K topics at evenly spaced ranks of the size of their own layer (the largest and the smallest included)
          python3 - <<'PY' > "$RUNNER_TEMP/layer-order.txt"
          import json, os
          t = os.environ["RUNNER_TEMP"]
          k = int(os.environ["TOPICS_MEASURED"])
          p = json.load(open(f"{t}/layers/layers.json", encoding="utf-8"))
          found = [x for x in p["layers"] if x["topic"] is None]
          tops = sorted((x for x in p["layers"] if x["topic"] is not None), key=lambda x: (-x["constants"], x["module"]))
          ranks = sorted({round(i * (len(tops) - 1) / max(1, k - 1)) for i in range(k)}) if tops and k > 0 else []
          for layer in found + [tops[i] for i in ranks]:
              print(layer["module"], layer["file"], *layer["imports"])
          PY
          cat "$RUNNER_TEMP/layer-order.txt" | cut -d' ' -f1 | tr '\n' ' '; echo
          : > "$RUNNER_TEMP/layer-stats.jsonl"
          # the export is parsed once and every layer replays from the parsed file (a layer is its own process, tengai ADR-0005)
          /usr/bin/time -v "$replay" "$RUNNER_TEMP/sample-stmt.ndjson" --save-tables "$RUNNER_TEMP/tables.olean" 2> "$RUNNER_TEMP/tables-time.txt" | tee -a "$GITHUB_STEP_SUMMARY"
