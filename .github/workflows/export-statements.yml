      - name: "Layers: the replayed layers exported again from their .olean files and checked by nanoda, an independent kernel that shares no code with Lean (invariant I1); a theorem is an axiom of its type here, so it checks every other declaration"
        if: env.LAYERS == 'true' && env.LAYERS_REPLAY == 'true' && env.NANODA == 'true' && env.WIDE_SAMPLE == 'true'
        timeout-minutes: 120
        run: |
          # the exporter WITHOUT our patch and the checker, both from the commits Tengoku's independent check pins: nothing of ours stands between the .olean files and the checker
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export-plain"
          git -C "$RUNNER_TEMP/lean4export-plain" checkout -q "$LEAN4EXPORT_COMMIT"
          (cd "$RUNNER_TEMP/lean4export-plain" && lake build 2>&1 | tail -2)
          git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout -q "$NANODA_COMMIT"
          (cd "$RUNNER_TEMP/nanoda" && cargo build --release --locked 2>&1 | tail -2)
          nanoda="$RUNNER_TEMP/nanoda/target/release/nanoda_bin"
          # conf EXPORT PERMIT_ALL_AXIOMS AXIOM_IS_AN_ERROR: the configuration of one run (Lean core declares sorryAx and the compiler axioms, as in Tengoku's nightly: nanoda admits them)
          conf() { printf '{"export_file_path": "%s", "use_stdin": false, "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "sorryAx", "Lean.ofReduceBool", "Lean.ofReduceNat", "Lean.trustCompiler"], "unsafe_permit_all_axioms": %s, "unpermitted_axiom_hard_error": %s, "num_threads": 4, "nat_extension": true, "string_extension": true, "print_success_message": true}\n' "$1" "$2" "$3"; }
          # the checker works at all: nanoda's own empty export
          conf "$RUNNER_TEMP/nanoda/test_resources/Empty/export" false true > "$RUNNER_TEMP/nanoda-selftest.json"
          "$nanoda" "$RUNNER_TEMP/nanoda-selftest.json"
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/layered:$core_path"
          mapfile -t mods < <(cut -d' ' -f1 "$RUNNER_TEMP/layer-order.txt")
          # every layer imported: the export holds Lean core and all the layers, so a topic's references into the foundation are checked against the foundation as the .olean files hold it
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export-plain/.lake/build/bin/lean4export" "${mods[@]}" > "$RUNNER_TEMP/layered.ndjson" 2> "$RUNNER_TEMP/layered-export-time.txt" || { tail -20 "$RUNNER_TEMP/layered-export-time.txt"; exit 1; }
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/layered-export-time.txt" | tr -s '\t' ' '
          wc -lc "$RUNNER_TEMP/layered.ndjson"
          cd "$GITHUB_WORKSPACE"
          # a control: with every axiom an error the checker must STOP on the statements that stand as axioms: if it passes, it did not read what this step exports
          conf "$RUNNER_TEMP/layered.ndjson" false true > "$RUNNER_TEMP/nanoda-control.json"
          if "$nanoda" "$RUNNER_TEMP/nanoda-control.json" > "$RUNNER_TEMP/nanoda-control.out" 2>&1; then echo "::error::the control passed: nanoda found no unpermitted axiom in an export that is full of them"; exit 1; fi
          echo "control: nanoda stops on the statements that stand as axioms ($(grep -ciE 'axiom' "$RUNNER_TEMP/nanoda-control.out" || true) lines mention one)"
          conf "$RUNNER_TEMP/layered.ndjson" true false > "$RUNNER_TEMP/nanoda-layers.json"
          if /usr/bin/time -v "$nanoda" "$RUNNER_TEMP/nanoda-layers.json" > "$RUNNER_TEMP/nanoda-layers.out" 2> "$RUNNER_TEMP/nanoda-layers-time.txt"; then echo ok > "$RUNNER_TEMP/nanoda-layers.status"; else echo FAILED > "$RUNNER_TEMP/nanoda-layers.status"; fi
          checked="$(grep -E 'Checked [0-9]+ declarations with no errors' "$RUNNER_TEMP/nanoda-layers.out" | tail -1 || true)"
          echo "the replayed layers, independent check (nanoda): $(cat "$RUNNER_TEMP/nanoda-layers.status"); ${checked:-no success line}" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/nanoda-layers-time.txt" | tr -s '\t' ' ' || true
          if [ "$(cat "$RUNNER_TEMP/nanoda-layers.status")" != ok ]; then echo "--- nanoda stderr (the reason) ---"; head -60 "$RUNNER_TEMP/nanoda-layers-time.txt"; exit 1; fi
          rm -f "$RUNNER_TEMP/layered.ndjson"
      - name: "The licence texts and notices of every library, as its repository holds them at the commit the snapshot took it from (they travel inside the archive, under legal/)"
        if: env.LAYERS == 'true' && env.LAYERS_REPLAY == 'true' && env.PACK == 'true' && env.WIDE_SAMPLE == 'true'
        continue-on-error: true   # a network call: if it fails the snapshot is packed without them, and the release gate (tools/release/notes.py) refuses a snapshot that carries none
        run: |
