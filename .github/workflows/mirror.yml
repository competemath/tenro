# Invariant I6 (Tengai's docs/design.md): tenro/core is Tengai, exactly. On every change, and once a day for the day Tengai moves.
name: mirror
on:
  pull_request:
    paths: ["core/**", "core.lock", "lean-toolchain", "hyp/**", "tools/mirror/**", ".github/workflows/mirror.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: The tool, on throwaway repositories
        run: python -m pip install -q pytest==8.4.1 && python -m pytest -q tests/test_mirror.py
      - name: core/ is Tengai at the tag in core.lock, or on a hypothesis branch that tag plus its patch
        run: |
          hyp=""
          case "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" in hyp/*) hyp="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"; hyp="${hyp#hyp/}" ;; esac
          if [ -n "$hyp" ]; then python tools/mirror/mirror.py check --hyp "$hyp"; else python tools/mirror/mirror.py check; fi
      - name: Every registered hypothesis patch still applies to Tengai's main (the daily promotion dry run)
        run: python tools/mirror/mirror.py dry-run
