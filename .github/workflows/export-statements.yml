# The statements export (docs/statements.md): lean4export with tools/export/lean4export-statements.patch writes a theorem as an AXIOM of its type and does not visit its proof, so a whole tree exports in a fraction
# of the lines (the statement-only closure of the wide sample is 6 % of the terms of the full one, workflow stmt-closure). The cheap gates run first and stop the run if they fail: the patched exporter builds, and
# Init exported both ways (full, --statements) agrees on every declaration it shares (tools/export/compare_exports.py). Then the wide sample of the transplant runs is exported as statements (the same roots as the
# 1.6 GB snapshot, for an apples-to-apples size) and the whole tree is exported as statements (lines, bytes, time, memory), and a replay of each through the kernel (tengai-replay from core/) is tried as a probe:
# size of the module, what a session loads. Manual. It measures; it changes nothing.
name: export-statements
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules to import and export whole, separated by spaces (a tree: Tengoku.All)"
        required: true
        default: "Tengoku.All"
      wide_sample:
        description: "Also export a sample of the intake theorems as statements (by default the wide sample of the transplant runs: 16 libraries, 4,800 theorems, seed wide-2), for a size to set against the snapshot of the same roots: true or false"
        required: true
        default: "true"
      sample_libraries:
        description: "The intake libraries of the sample (keys of data/intake, separated by spaces), or all"
        required: true
        default: "aintlib compfiles azurite nlalib complexitylib causalean linearhadwiger leancert regularity-lemmata lie-lean formal-mathfin imoshortlist erdos-lean cslib physlib brownian-motion"
      sample_count:
        description: "How many theorems the sample takes (more than there are: all of them)"
        required: true
        default: "4800"
      sample_seed:
        description: "The sample's seed"
        required: true
        default: "wide-2"
      tree:
        description: "Also export the whole tree as statements (25 minutes and 12 GB of memory for Tengoku.All): true or false"
        required: true
        default: "true"
      replay:
        description: "After the exports, try the kernel replay of each (tengai-replay from core/) and measure the module: true or false"
        required: true
        default: "true"
permissions: {}
concurrency:
  group: export-statements
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MODULES: ${{ inputs.modules }}
  REPLAY: ${{ inputs.replay }}
  WIDE_SAMPLE: ${{ inputs.wide_sample }}
  SAMPLE_LIBS: ${{ inputs.sample_libraries }}
  SAMPLE_COUNT: ${{ inputs.sample_count }}
  SAMPLE_SEED: ${{ inputs.sample_seed }}
  TREE: ${{ inputs.tree }}
  LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c  # pragma: allowlist secret (a commit, not a secret): the commit Tengoku's independent check pins for toolchain v4.34.0-rc2
  GH_TOKEN: ${{ github.token }}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lean4export at the pinned commit, with the --statements patch
        run: |
          for m in $MODULES; do [[ "$m" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "bad module $m"; exit 1; }; done
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          cd "$RUNNER_TEMP/lean4export"
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          patch -p1 < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          lake build 2>&1 | tail -3
          ls -l .lake/build/bin/lean4export
      - name: "The patch changes nothing but theorems: Init exported both ways (full, --statements) and compared declaration by declaration"
        run: |
          cd "$RUNNER_TEMP/lean4export"
          l4e=".lake/build/bin/lean4export"
          lake env "$l4e" Init > "$RUNNER_TEMP/init-full.ndjson" 2> "$RUNNER_TEMP/init-full.err"
          lake env "$l4e" Init --statements > "$RUNNER_TEMP/init-stmt.ndjson" 2> "$RUNNER_TEMP/init-stmt.err"
          wc -lc "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson"
          # nothing on stderr but the one line the patch prints (how many theorems are kept with their proofs)
          for f in full stmt; do
            grep -v '^lean4export --statements: ' "$RUNNER_TEMP/init-$f.err" > "$RUNNER_TEMP/init-$f.err.rest" || true
            test ! -s "$RUNNER_TEMP/init-$f.err.rest" || { echo "stderr of the $f export:"; head -20 "$RUNNER_TEMP/init-$f.err.rest"; exit 1; }
          done
          grep '^lean4export --statements: ' "$RUNNER_TEMP/init-stmt.err" | tee -a "$GITHUB_STEP_SUMMARY" || true
          cd "$GITHUB_WORKSPACE"
          { echo "### Init, full and with --statements"; echo; echo '```'; python3 tools/export/compare_exports.py "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson" --out "$RUNNER_TEMP/init-compare.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os,sys; sys.exit(0 if json.load(open(os.environ["RUNNER_TEMP"] + "/init-compare.json"))["passed"] else 1)'
      - name: The Init exports, compressed, for a look at what differs (only when the comparison failed)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/init-exports"
          zstd -3 -T0 -q "$RUNNER_TEMP/init-full.ndjson" -o "$RUNNER_TEMP/init-exports/init-full.ndjson.zst"
          zstd -3 -T0 -q "$RUNNER_TEMP/init-stmt.ndjson" -o "$RUNNER_TEMP/init-exports/init-stmt.ndjson.zst"
          ls -l "$RUNNER_TEMP/init-exports"
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: "The sample as statements (by default the wide sample of the transplant runs): the same roots, theorems as axioms unless a definition's value mentions them"
        if: env.WIDE_SAMPLE == 'true'
        run: |
          [[ "$SAMPLE_COUNT" =~ ^[0-9]+$ ]] || { echo "bad count"; exit 1; }
          for l in $SAMPLE_LIBS; do [[ "$l" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad library $l"; exit 1; }; done
          python3 tools/promote/pick.py --manifests .tengoku/data/intake --libraries "$SAMPLE_LIBS" --n "$SAMPLE_COUNT" --seed "$SAMPLE_SEED" --names "$RUNNER_TEMP/names.txt" --modules "$RUNNER_TEMP/export-modules.txt" --sample "$RUNNER_TEMP/sample.jsonl"
          wc -l "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/export-modules.txt"
          mapfile -t mods < "$RUNNER_TEMP/export-modules.txt"
          cd .tengoku
          # a sampled name that is not a constant of the tree is a PANIC line on stderr and the export goes on without it (22 of the 4,800); the names come from a file (hundreds of thousands do not fit on a command line)
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" --statements --names-file="$RUNNER_TEMP/names.txt" > "$RUNNER_TEMP/sample-stmt.ndjson" 2> "$RUNNER_TEMP/sample-stmt.err" || { head -40 "$RUNNER_TEMP/sample-stmt.err"; exit 1; }
          grep -E "^lean4export --statements: " "$RUNNER_TEMP/sample-stmt.err" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "PANIC lines: $(grep -cE '^PANIC' "$RUNNER_TEMP/sample-stmt.err" || true)"
          cd "$GITHUB_WORKSPACE"
          python3 tools/export/export_stats.py "$RUNNER_TEMP/sample-stmt.ndjson" --time-log "$RUNNER_TEMP/sample-stmt.err" --label "The sample as statements ($(wc -l < "$RUNNER_TEMP/names.txt") theorems of $SAMPLE_LIBS, seed $SAMPLE_SEED)" --out "$RUNNER_TEMP/sample-stmt-stats.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "The whole tree as statements (lean4export --statements over the modules, no names, so every constant)"
        if: env.TREE == 'true'
        working-directory: .tengoku
        run: |
          read -ra mods <<< "$MODULES"
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" --statements > "$RUNNER_TEMP/tree-stmt.ndjson" 2> "$RUNNER_TEMP/tree-stmt.err" || { head -40 "$RUNNER_TEMP/tree-stmt.err"; exit 1; }
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/tree-stmt.err" || true
          cd "$GITHUB_WORKSPACE"
          python3 tools/export/export_stats.py "$RUNNER_TEMP/tree-stmt.ndjson" --time-log "$RUNNER_TEMP/tree-stmt.err" --label "The whole tree as statements ($MODULES)" --out "$RUNNER_TEMP/tree-stmt-stats.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Probe: the kernel replay of each statements export (tengai-replay from core/), the size of the module, what a session loads"
        if: env.REPLAY == 'true'
        continue-on-error: true
        timeout-minutes: 200
        run: |
          (cd core && lake build tengai-replay 2>&1 | tail -3)
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          core_path="$(cd core && lake env printenv LEAN_PATH)"
          printf 'import Init\n' > "$RUNNER_TEMP/empty.lean"
          for label in sample tree; do
            export_file="$RUNNER_TEMP/$label-stmt.ndjson"
            [ -s "$export_file" ] || continue
            module="TengaiData.Statements${label^}"
            out="$RUNNER_TEMP/out-$label"
            mkdir -p "$out"
            rc=0
            # --stub-refused: a definition the kernel still refuses (it has to compute through a proof that the export left out) becomes an axiom of its type and is listed, instead of stopping the replay at the first
            /usr/bin/time -v "$replay" "$export_file" --module "$module" --out "$out" --stub-refused > "$RUNNER_TEMP/replay-$label-stats.json" 2> "$RUNNER_TEMP/replay-$label-time.txt" || rc=$?
            echo "== $label: $(grep -E 'Elapsed|Maximum resident' "$RUNNER_TEMP/replay-$label-time.txt" | tr -s '\t' ' ' | tr '\n' ';')"
            if [ "$rc" != 0 ]; then echo "$label: replay exit $rc; the reason:"; grep -v "^\s" "$RUNNER_TEMP/replay-$label-time.txt" | head -40; continue; fi
            python3 - "$RUNNER_TEMP/replay-$label-stats.json" "$RUNNER_TEMP/refused-$label.txt" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          st = json.loads(open(sys.argv[1], encoding="utf-8").read().strip().splitlines()[-1])["replay"]
          names = st.pop("refused", [])
          open(sys.argv[2], "w", encoding="utf-8").write("".join(n + "\n" for n in names))
          print(f"replay: {json.dumps(st, sort_keys=True)}; {len(names)} declarations were refused by the kernel and stand as axioms of their type" + (f", for example {names[:5]}" if names else ""))
          PY
            olean="$out/${module//./\/}.olean"
            ls -l "$olean"
            printf 'import %s\n' "$module" > "$RUNNER_TEMP/import-$label.lean"
            (cd core && LEAN_PATH="$out:$core_path" python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/empty.lean" | tee "$RUNNER_TEMP/import-empty-$label.json")
            (cd core && LEAN_PATH="$out:$core_path" python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/import-$label.lean" | tee "$RUNNER_TEMP/import-$label.json")
            { echo "### The replay of the $label statements export"; echo; echo '```'; grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/replay-$label-time.txt"; ls -l "$olean"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: export-statements-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/init-compare.json
            ${{ runner.temp }}/init-exports/*
            ${{ runner.temp }}/sample-stmt-stats.json
            ${{ runner.temp }}/tree-stmt-stats.json
            ${{ runner.temp }}/replay-*-stats.json
            ${{ runner.temp }}/refused-*.txt
            ${{ runner.temp }}/replay-*-time.txt
            ${{ runner.temp }}/import-*.json
          retention-days: 30
          if-no-files-found: warn
