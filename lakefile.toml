name = "tenro"
defaultTargets = ["Tenro"]

# The gate is the compiler: any warning (an unused variable, a `sorry`, a deprecation) is an error here.
[leanOptions]
pp.unicode.fun = true
maxSynthPendingDepth = 3
warningAsError = true

# Tengoku, at the commit in tengoku.pin, with its compiled cache: scripts/tengoku-setup.sh puts it in .tengoku.
[[require]]
name = "tengoku"
path = ".tengoku"

# The clean core, exactly (core.lock; tools/mirror/mirror.py). Tenro's overlay may import it; it never edits it.
[[require]]
name = "Tengai"
path = "core"

[[lean_lib]]
name = "Tenro"
globs = ["Tenro", "Tenro.+"]
