        run: |
          python3 - <<'PY'
          import json, os, sys
          t = os.environ["RUNNER_TEMP"]
          planned = len(json.load(open(f"{t}/layers/layers.json", encoding="utf-8"))["layers"])
          replayed = sum(1 for line in open(f"{t}/layer-order.txt", encoding="utf-8") if line.strip())
          if replayed != planned:
              sys.exit(f"pack needs every layer replayed: {replayed} of {planned}; set topics_measured to the number of topics")
          PY
          # what the snapshot came from: the tenro commit that made the export (the run of export_run, or this run), its Tengoku pin and exporter patch
          src_sha="$GITHUB_SHA"
          if [ -n "$EXPORT_RUN" ]; then src_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPORT_RUN" -q .head_sha)"; fi
