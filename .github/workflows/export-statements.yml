# The statements export (docs/statements.md): lean4export with tools/export/lean4export-statements.patch writes a theorem as an AXIOM of its type and does not visit its proof, so a whole tree exports in a fraction
# of the lines (the statement-only closure of the wide sample is 6 % of the terms of the full one, workflow stmt-closure). The cheap gates run first and stop the run if they fail: the patched exporter builds, and
# Init exported both ways (full, --statements) agrees on every declaration it shares (tools/export/compare_exports.py). Then the whole tree is exported as statements (lines, bytes, time, memory), and a replay of it
# through the kernel (tengai-replay from core/) is tried as a probe: size of the module, what a session loads. Manual. It measures; it changes nothing.
name: export-statements
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules to import and export whole, separated by spaces (a tree: Tengoku.All)"
        required: true
        default: "Tengoku.All"
      replay:
        description: "After the export, try the kernel replay of it (tengai-replay from core/) and measure the module: true or false"
        required: true
        default: "true"
permissions: {}
concurrency:
  group: export-statements
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MODULES: ${{ inputs.modules }}
  REPLAY: ${{ inputs.replay }}
  LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c  # pragma: allowlist secret (a commit, not a secret): the commit Tengoku's independent check pins for toolchain v4.34.0-rc2
  GH_TOKEN: ${{ github.token }}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lean4export at the pinned commit, with the --statements patch
        run: |
          for m in $MODULES; do [[ "$m" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "bad module $m"; exit 1; }; done
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          cd "$RUNNER_TEMP/lean4export"
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          patch -p1 < "$GITHUB_WORKSPACE/tools/export/lean4export-statements.patch"
          lake build 2>&1 | tail -3
          ls -l .lake/build/bin/lean4export
      - name: "The patch changes nothing but theorems: Init exported both ways (full, --statements) and compared declaration by declaration"
        run: |
          cd "$RUNNER_TEMP/lean4export"
          l4e=".lake/build/bin/lean4export"
          lake env "$l4e" Init > "$RUNNER_TEMP/init-full.ndjson" 2> "$RUNNER_TEMP/init-full.err"
          lake env "$l4e" Init --statements > "$RUNNER_TEMP/init-stmt.ndjson" 2> "$RUNNER_TEMP/init-stmt.err"
          wc -lc "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson"
          for f in full stmt; do test ! -s "$RUNNER_TEMP/init-$f.err" || { echo "stderr of the $f export:"; head -20 "$RUNNER_TEMP/init-$f.err"; exit 1; }; done
          cd "$GITHUB_WORKSPACE"
          { echo "### Init, full and with --statements"; echo; echo '```'; python3 tools/export/compare_exports.py "$RUNNER_TEMP/init-full.ndjson" "$RUNNER_TEMP/init-stmt.ndjson" --out "$RUNNER_TEMP/init-compare.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os,sys; sys.exit(0 if json.load(open(os.environ["RUNNER_TEMP"] + "/init-compare.json"))["passed"] else 1)'
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: "The whole tree as statements (lean4export --statements over the modules, no names, so every constant)"
        working-directory: .tengoku
        run: |
          read -ra mods <<< "$MODULES"
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" --statements > "$RUNNER_TEMP/tree-stmt.ndjson" 2> "$RUNNER_TEMP/tree-stmt.err" || { head -40 "$RUNNER_TEMP/tree-stmt.err"; exit 1; }
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/tree-stmt.err" || true
          grep -vE "^\s|^Command|^Exit" "$RUNNER_TEMP/tree-stmt.err" | head -10 || true
          wc -lc "$RUNNER_TEMP/tree-stmt.ndjson"
      - name: "The size of it (lines by kind, bytes, compressed), and the stats record"
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          t = os.environ["RUNNER_TEMP"]
          f = f"{t}/tree-stmt.ndjson"

          def count(pattern: str) -> int:
              r = subprocess.run(["grep", "-c", "-E", pattern, f], capture_output=True, text=True)
              return int(r.stdout.strip() or 0)

          err = open(f"{t}/tree-stmt.err", encoding="utf-8", errors="replace").read()
          wall = re.search(r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\): ([0-9:.]+)", err)
          rss = re.search(r"Maximum resident set size \(kbytes\): (\d+)", err)
          lines = int(subprocess.run(["wc", "-l", f], capture_output=True, text=True).stdout.split()[0])
          zst = int(subprocess.run(f"zstd -3 -T0 -c {f} | wc -c", shell=True, capture_output=True, text=True).stdout.split()[0])
          stats = {
              "modules": os.environ["MODULES"].split(),
              "lean4export_commit": os.environ["LEAN4EXPORT_COMMIT"],
              "lines": lines,
              "bytes": os.path.getsize(f),
              "zstd3_bytes": zst,
              "names": count(r'^\{"in":'),
              "levels": count(r'^\{"il":'),
              "terms": count(r'"ie":'),
              "declarations": {k: count(rf'^\{{"{k}":') for k in ("axiom", "def", "inductive", "opaque", "quot", "thm")},
              "export_wall": wall.group(1) if wall else None,
              "export_max_rss_kb": int(rss.group(1)) if rss else None,
          }
          json.dump(stats, open(f"{t}/tree-stmt-stats.json", "w"), indent=1, sort_keys=True)
          d = stats["declarations"]
          md = [
              "### The whole tree as statements",
              "",
              f"{stats['lines']:,} lines, {stats['bytes'] / 1e6:,.0f} MB ({stats['zstd3_bytes'] / 1e6:,.0f} MB with zstd -3); export {stats['export_wall']}, peak {(stats['export_max_rss_kb'] or 0) / 1e6:.1f} GB.",
              "",
              "| names | levels | terms | axioms | definitions | inductive groups | opaque | quot | theorems |",
              "|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
              f"| {stats['names']:,} | {stats['levels']:,} | {stats['terms']:,} | {d['axiom']:,} | {d['def']:,} | {d['inductive']:,} | {d['opaque']:,} | {d['quot']:,} | {d['thm']:,} |",
          ]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(md) + "\n")
          print("\n".join(md))
          assert d["thm"] == 0, "a theorem is left in the statements export"
          PY
      - name: "Probe: the kernel replay of the statements export (tengai-replay from core/), the size of the module, what a session loads"
        if: env.REPLAY == 'true'
        continue-on-error: true
        timeout-minutes: 150
        run: |
          (cd core && lake build tengai-replay 2>&1 | tail -3)
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          mkdir -p "$RUNNER_TEMP/out"
          rc=0
          /usr/bin/time -v "$replay" "$RUNNER_TEMP/tree-stmt.ndjson" --module TengaiData.Statements --out "$RUNNER_TEMP/out" > "$RUNNER_TEMP/replay-stats.json" 2> "$RUNNER_TEMP/replay-time.txt" || rc=$?
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/replay-time.txt" || true
          if [ "$rc" != 0 ]; then echo "replay exit $rc; the reason:"; grep -v "^\s" "$RUNNER_TEMP/replay-time.txt" | head -40; exit 1; fi
          cat "$RUNNER_TEMP/replay-stats.json" | head -c 1500; echo
          ls -l "$RUNNER_TEMP/out/TengaiData/Statements.olean"
          { echo "### The replay of the statements export"; echo; echo '```'; grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/replay-time.txt"; ls -l "$RUNNER_TEMP/out/TengaiData/Statements.olean"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/out:$core_path"
          printf 'import Init\n' > "$RUNNER_TEMP/empty.lean"
          printf 'import TengaiData.Statements\n' > "$RUNNER_TEMP/import-only.lean"
          python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/empty.lean" | tee "$RUNNER_TEMP/import-empty.json"
          python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/import-only.lean" | tee "$RUNNER_TEMP/import-stmt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: export-statements-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/init-compare.json
            ${{ runner.temp }}/tree-stmt-stats.json
            ${{ runner.temp }}/replay-stats.json
            ${{ runner.temp }}/replay-time.txt
            ${{ runner.temp }}/import-empty.json
            ${{ runner.temp }}/import-stmt.json
          retention-days: 30
          if-no-files-found: warn
