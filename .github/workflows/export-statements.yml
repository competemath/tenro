      - name: "Layers: what a session loads (the cold import of the foundation and of each topic with it, over an empty session; paired rounds, tools/promote/import_time.py)"
        if: env.LAYERS == 'true' && env.LAYERS_REPLAY == 'true' && env.WIDE_SAMPLE == 'true'
        run: |
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          printf 'import Init\n' > "$RUNNER_TEMP/l-empty.lean"
          python3 - <<'PY' > "$RUNNER_TEMP/l-sets.txt"
          import json, os
          t = os.environ["RUNNER_TEMP"]
          p = json.load(open(f"{t}/layers/layers.json", encoding="utf-8"))
          done = {line.split()[0] for line in open(f"{t}/layer-order.txt", encoding="utf-8") if line.strip()}
          for layer in p["layers"]:
              if layer["module"] in done:
                  print(layer["module"].removeprefix("TengaiData.").replace(".", "_"), layer["module"])  # Foundation, Topic_Aintlib, ...
          # combinations, for comparison (a session that needs several libraries): the four largest topics, and every layer replayed
          tops = sorted((x for x in p["layers"] if x["module"] in done and x["topic"] is not None), key=lambda x: (-x["constants"], x["module"]))
          if len(tops) >= 4:
              print("Combo_Giants", *[x["module"] for x in tops[:4]])
          if len(tops) >= 2:
              print("Combo_All", *[x["module"] for x in p["layers"] if x["module"] in done])
          PY
          args=(--runs 9 --baseline "lake env lean $RUNNER_TEMP/l-empty.lean")
          while read -r label modules; do
            read -r -a wanted <<< "$modules"
            : > "$RUNNER_TEMP/l-$label.lean"; for m in "${wanted[@]}"; do printf 'import %s\n' "$m" >> "$RUNNER_TEMP/l-$label.lean"; done
            args+=(--target "$label=lake env lean $RUNNER_TEMP/l-$label.lean")
          done < "$RUNNER_TEMP/l-sets.txt"
          LEAN_PATH="$RUNNER_TEMP/layered:$core_path" python3 ../tools/promote/import_time.py compare "${args[@]}" > "$RUNNER_TEMP/l-compare.json"
          cd ..
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/layers-load.md"
          import json, os, tomllib
          t = os.environ["RUNNER_TEMP"]
          p = json.load(open(f"{t}/layers/layers.json", encoding="utf-8"))
          by_module = {x["module"]: x for x in p["layers"]}
          size = {m: os.path.getsize(f"{t}/layered/" + m.replace(".", "/") + ".olean") for m in by_module if os.path.exists(f"{t}/layered/" + m.replace(".", "/") + ".olean")}
          cmp = json.load(open(f"{t}/l-compare.json", encoding="utf-8"))
          empty = cmp["baseline"]
          cap = tomllib.load(open("perf-budget.toml", "rb"))["load"]["cap_net_median_s"]
          rows = []
          for line in open(f"{t}/l-sets.txt", encoding="utf-8"):
              label, *mods = line.split()
              loaded = set()
              for m in mods:
                  loaded.add(m)
                  loaded.update(by_module[m]["imports"])
              consts = sum(by_module[m]["constants"] for m in loaded)
              rows.append((label, consts, sum(size[m] for m in loaded) / 1e6, cmp[label]))
          print("## what a session loads: the foundation, and a topic with it (Combo_: several topics in one session, for comparison)")
          print("| imports | constants loaded | olean MB loaded | cold import, median (s) | net over an empty module, paired median (s) | net, fastest runs (s) |")
          print("|---|---:|---:|---:|---:|---:|")
          for label, consts, mb, r in rows:
              print(f"| {label} | {consts:,} | {mb:.1f} | {r['median']} | {r['net_median']:.3f} | {r['net_min']:.3f} |")
          print(f"\nan empty module: median {empty['median']} s, fastest {empty['min']} s ({len(cmp['runs']['baseline'])} paired rounds); cap C_load {cap} s (net, paired median)")
          singles = [x for x in rows if not x[0].startswith("Combo_")]
          over = [label for label, _, _, r in singles if r["net_median"] > cap]
          print(f"sessions over the cap (the foundation, and the foundation with one topic; {len(singles)} measured): {', '.join(over) if over else 'none'}")
          if singles:
              worst = max(singles, key=lambda x: x[3]["net_median"])
              print(f"the slowest of them: {worst[0]}, {worst[1]:,} constants, +{worst[3]['net_median']:.3f} s")
          json.dump({"rows": [[label, mb, {**r, "constants": c}] for label, c, mb, r in rows], "empty": empty, "olean": size, "cap": cap}, open(f"{t}/layers-load.json", "w", encoding="utf-8"))
          PY
      - name: "Faithful: the same records in the snapshot's environment, compared with the source's"
        if: env.LAYERS == 'true' && env.LAYERS_REPLAY == 'true' && env.WIDE_SAMPLE == 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/source-hashes.jsonl" ]; then
            echo "::notice::the export of run $EXPORT_RUN has no source hashes (a run with source_hashes=true makes them): the faithfulness check did not run"
            exit 0
          fi
          # the names of the layers that were replayed
          : > "$RUNNER_TEMP/replayed-names.jsonl"
          while read -r _ file _; do cat "$RUNNER_TEMP/layers/$file" >> "$RUNNER_TEMP/replayed-names.jsonl"; done < "$RUNNER_TEMP/layer-order.txt"
          wc -l "$RUNNER_TEMP/replayed-names.jsonl"
