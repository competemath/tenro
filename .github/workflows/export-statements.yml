          wc -l "$RUNNER_TEMP/ext-names.jsonl"
          cd .tengoku
          /usr/bin/time -v lake env "$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-extinfo" "$RUNNER_TEMP/ext-names.jsonl" Tengoku.All > "$RUNNER_TEMP/ext.jsonl" 2> "$RUNNER_TEMP/ext-time.txt" || { tail -20 "$RUNNER_TEMP/ext-time.txt"; exit 1; }
          grep -E "extinfo:|Elapsed|Maximum resident" "$RUNNER_TEMP/ext-time.txt" | tr -s '\t' ' '
          cd "$GITHUB_WORKSPACE"
          # every row must belong to a layer: the split by layer is the first thing a replay does, and it refuses a row that no layer holds
          python3 tools/promote/ext_partition.py "$RUNNER_TEMP/ext.jsonl" --layers "$RUNNER_TEMP/layers" --out "$RUNNER_TEMP/ext-check" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "The sample's export, compressed, with its names and topics (a later job replays it without Tengoku)"
        if: env.KEEP_EXPORT == 'true' && env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == ''
        run: |
          mkdir -p "$RUNNER_TEMP/kept"
          zstd -3 -T0 -q "$RUNNER_TEMP/sample-stmt.ndjson" -o "$RUNNER_TEMP/kept/sample-stmt.ndjson.zst"
          for f in names.txt sample.jsonl topics.json missing-names.txt sample-stmt-stats.json attribution.json; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/kept/$f"; fi
          done
          if [ -f "$RUNNER_TEMP/source-hashes.jsonl" ]; then zstd -3 -T0 -q "$RUNNER_TEMP/source-hashes.jsonl" -o "$RUNNER_TEMP/kept/source-hashes.jsonl.zst"; fi
          if [ -f "$RUNNER_TEMP/ext.jsonl" ]; then zstd -3 -T0 -q "$RUNNER_TEMP/ext.jsonl" -o "$RUNNER_TEMP/kept/ext.jsonl.zst"; fi
          echo "${DROP_PROOFS:-false}" > "$RUNNER_TEMP/kept/drop-proofs.txt"
          ls -l "$RUNNER_TEMP/kept"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.KEEP_EXPORT == 'true' && env.WIDE_SAMPLE == 'true' && env.EXPORT_RUN == ''
        with:
          name: statements-export-${{ github.run_id }}
          path: ${{ runner.temp }}/kept/*
          retention-days: 30
          compression-level: 0   # the export is already compressed (zstd)
          if-no-files-found: error
      - name: "The whole tree as statements (lean4export --statements over the modules, no names, so every constant)"
        if: env.TREE == 'true' && env.EXPORT_RUN == ''
        working-directory: .tengoku
        run: |
          read -ra mods <<< "$MODULES"
          drop=(); if [ "$DROP_PROOFS" = true ]; then drop=(--drop-proofs); fi
          /usr/bin/time -v lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" --statements "${drop[@]}" > "$RUNNER_TEMP/tree-stmt.ndjson" 2> "$RUNNER_TEMP/tree-stmt.err" || { head -40 "$RUNNER_TEMP/tree-stmt.err"; exit 1; }
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/tree-stmt.err" || true
          cd "$GITHUB_WORKSPACE"
          python3 tools/export/export_stats.py "$RUNNER_TEMP/tree-stmt.ndjson" --time-log "$RUNNER_TEMP/tree-stmt.err" --label "The whole tree as statements ($MODULES)" --out "$RUNNER_TEMP/tree-stmt-stats.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Probe: the kernel replay of each statements export (tengai-replay from core/), the size of the module, what a session loads"
        if: env.REPLAY == 'true'
        continue-on-error: true
        timeout-minutes: 200
        run: |
          (cd core && lake build tengai-replay 2>&1 | tail -3)
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          core_path="$(cd core && lake env printenv LEAN_PATH)"
          printf 'import Init\n' > "$RUNNER_TEMP/empty.lean"
          for label in sample tree; do
            export_file="$RUNNER_TEMP/$label-stmt.ndjson"
            [ -s "$export_file" ] || continue
            module="TengaiData.Statements${label^}"
            out="$RUNNER_TEMP/out-$label"
            mkdir -p "$out"
            rc=0
            # --stub-refused: a definition the kernel still refuses (it has to compute through a proof that the export left out) becomes an axiom of its type and is listed, instead of stopping the replay at the first
            /usr/bin/time -v "$replay" "$export_file" --module "$module" --out "$out" --stub-refused > "$RUNNER_TEMP/replay-$label-stats.json" 2> "$RUNNER_TEMP/replay-$label-time.txt" || rc=$?
            echo "== $label: $(grep -E 'Elapsed|Maximum resident' "$RUNNER_TEMP/replay-$label-time.txt" | tr -s '\t' ' ' | tr '\n' ';')"
            if [ "$rc" != 0 ]; then echo "$label: replay exit $rc; the reason:"; grep -v "^\s" "$RUNNER_TEMP/replay-$label-time.txt" | head -40; continue; fi
            python3 - "$RUNNER_TEMP/replay-$label-stats.json" "$RUNNER_TEMP/refused-$label.txt" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          st = json.loads(open(sys.argv[1], encoding="utf-8").read().strip().splitlines()[-1])["replay"]
          names = st.pop("refused", [])
          open(sys.argv[2], "w", encoding="utf-8").write("".join(n + "\n" for n in names))
          print(f"replay: {json.dumps(st, sort_keys=True)}; {len(names)} declarations were refused by the kernel and stand as axioms of their type" + (f", for example {names[:5]}" if names else ""))
          PY
            olean="$out/${module//./\/}.olean"
            ls -l "$olean"
            printf 'import %s\n' "$module" > "$RUNNER_TEMP/import-$label.lean"
            (cd core && LEAN_PATH="$out:$core_path" python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/empty.lean" | tee "$RUNNER_TEMP/import-empty-$label.json")
            (cd core && LEAN_PATH="$out:$core_path" python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/import-$label.lean" | tee "$RUNNER_TEMP/import-$label.json")
            { echo "### The replay of the $label statements export"; echo; echo '```'; grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/replay-$label-time.txt"; ls -l "$olean"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: export-statements-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/init-compare.json
            ${{ runner.temp }}/init-exports/*
            ${{ runner.temp }}/sample-stmt-stats.json
            ${{ runner.temp }}/tree-stmt-stats.json
            ${{ runner.temp }}/replay-*-stats.json
            ${{ runner.temp }}/refused-*.txt
            ${{ runner.temp }}/layers/layers.json
            ${{ runner.temp }}/layers-time.txt
            ${{ runner.temp }}/missing-names.txt
            ${{ runner.temp }}/layers-load.json
            ${{ runner.temp }}/layers-load.md
            ${{ runner.temp }}/faithful.json
            ${{ runner.temp }}/source-hashes-time.txt
            ${{ runner.temp }}/snapshot-hashes-time.txt
            ${{ runner.temp }}/layer-stats.jsonl
            ${{ runner.temp }}/layer-order.txt
            ${{ runner.temp }}/tables-time.txt
            ${{ runner.temp }}/replay-*-time.txt
            ${{ runner.temp }}/import-*.json
          retention-days: 30
          if-no-files-found: warn
