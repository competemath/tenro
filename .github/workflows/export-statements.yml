          (cd core && LEAN_PATH="$RUNNER_TEMP/unpacked:$core_path" lake env lean "$RUNNER_TEMP/check.lean" > "$RUNNER_TEMP/check.out" 2> "$RUNNER_TEMP/check.err") || { head -20 "$RUNNER_TEMP/check.err" "$RUNNER_TEMP/check.out"; exit 1; }
