# Regenerates the labelled statement groups the tawatur divergence metric is calibrated on (calibration/PROTOCOL.md). Manual: it reads the whole tree.
# Stages: tags in the sources -> duplicate ids -> `tengoku-isnad` on their modules (recomputed ids, full names) -> one targeted lean4export -> closure.py
# -> Tengoku's scripts/tawatur.py -> label.py -> summary. Nothing here proves anything: it measures the tree.
name: calibration
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: calibration
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c  # pragma: allowlist secret (a commit, not a secret): the commit Tengoku's independent check pins for toolchain v4.34.0-rc2
  TENGOKU_VERIFY: require
  GH_TOKEN: ${{ github.token }}
jobs:
  groups:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: { contents: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: tengoku-isnad and the scripts at tengoku-tools.pin (the tree is at tengoku.pin; the tools may be newer than the newest published cache)
        run: |
          pin="$(tr -d '[:space:]' < tengoku-tools.pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "tengoku-tools.pin must hold a full 40-character commit"; exit 1; }
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku "$RUNNER_TEMP/tengoku-tools"
          cd "$RUNNER_TEMP/tengoku-tools"
          git sparse-checkout set --no-cone '/TengokuIsnad.lean' '/scripts/' '/lakefile.toml' '/lean-toolchain' '/tools/isnad/'
          git checkout -q "$pin"
          lake build tengoku-isnad 2>&1 | tail -3
          echo "TOOLS=$RUNNER_TEMP/tengoku-tools" >> "$GITHUB_ENV"
      - name: Tags in the sources, the ids that occur twice
        run: |
          python3 tools/calibration/groups.py scan .tengoku > dup.json
          python3 tools/calibration/groups.py counts < dup.json
      - name: Recompute the ids of those modules (tengoku-isnad; a module that does not import is listed, not fatal)
        run: |
          cd .tengoku
          python3 ../tools/calibration/groups.py modules < ../dup.json > ../modules.txt
          python3 ../tools/calibration/run_isnad.py --modules ../modules.txt --out ../isnad.tsv --failed ../isnad-failed.txt --jobs 2 --exe "$TOOLS/.lake/build/bin/tengoku-isnad"
          wc -l ../isnad.tsv ../isnad-failed.txt
      - name: The group table and the names to export
        run: |
          python3 tools/calibration/groups.py meta --dup dup.json --isnad-py "$TOOLS/scripts/isnad.py" < isnad.tsv > meta-all.tsv
          # only groups with theorems from two or more libraries can be other than alias (rule 1); a deterministic sample of them is exported (the export of all would not fit in memory)
          python3 tools/calibration/groups.py select --max-groups 150 --stats groups-stats.json < meta-all.tsv > meta.tsv
          cat groups-stats.json
          cut -f1 meta.tsv > names.txt
          cut -f4 meta.tsv | sort -u > export-modules.txt
          wc -l meta.tsv names.txt export-modules.txt
      - name: lean4export at the pinned commit
        run: |
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          cd "$RUNNER_TEMP/lean4export" && lake build 2>&1 | tail -3
      - name: One targeted export of exactly those declarations, and where Lean's core is defined
        run: |
          mapfile -t mods < export-modules.txt
          mapfile -t names < names.txt
          cd .tengoku
          lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" -- "${names[@]}" > ../export.ndjson
          lake env lean --run ../tools/calibration/CoreModules.lean > ../core-modules.tsv
          wc -l ../export.ndjson ../core-modules.tsv
      - name: Reduced closures
        run: python3 tools/closure/closure.py export.ndjson --names-file names.txt --meta meta.tsv --modules core-modules.tsv > closures.jsonl
      - name: Tengoku's independence report on them (reference, parameters of docs/tawatur.md)
        run: python3 "$TOOLS/scripts/tawatur.py" report --k 3 --floor 5 --all < closures.jsonl > tawatur-report.jsonl
      - name: Label by the written protocol and summarise
        run: |
          python3 tools/calibration/label.py --input closures.jsonl > labels.jsonl
          python3 tools/calibration/thresholds.py labels.jsonl --human calibration/human.jsonl > thresholds.json
          cat thresholds.json
          python3 tools/calibration/summary.py labels.jsonl --stats groups-stats.json --tags-read "$(python3 tools/calibration/groups.py tags < dup.json)" | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration
          path: |
            dup.json
            meta.tsv
            meta-all.tsv
            groups-stats.json
            closures.jsonl
            tawatur-report.jsonl
            labels.jsonl
            summary.md
            thresholds.json
            isnad-failed.txt
            export-modules.txt
            names.txt
          retention-days: 30

  # The second axis (the waypoints) in a job of its own: the first one (closures, labels, thresholds on the footprint axis) is already uploaded, so a runner that is lost here
  # (it was, once, after two hours) costs only this job. It reads only the sampled theorems and gives every process a time limit, one at a time.
  waypoints:
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: { contents: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: tengoku-isnad and the scripts at tengoku-tools.pin (the tree is at tengoku.pin; the tools may be newer than the newest published cache)
        run: |
          pin="$(tr -d '[:space:]' < tengoku-tools.pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "tengoku-tools.pin must hold a full 40-character commit"; exit 1; }
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku "$RUNNER_TEMP/tengoku-tools"
          cd "$RUNNER_TEMP/tengoku-tools"
          git sparse-checkout set --no-cone '/TengokuIsnad.lean' '/scripts/' '/lakefile.toml' '/lean-toolchain' '/tools/isnad/'
          git checkout -q "$pin"
          lake build tengoku-isnad 2>&1 | tail -3
          echo "TOOLS=$RUNNER_TEMP/tengoku-tools" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: calibration
      - name: Waypoints (the ids of the statements of each proof's haves), for the sampled theorems only
        run: |
          if ! grep -q -e '--haves' "$TOOLS/TengokuIsnad.lean"; then
            echo "::error::the Tengoku at tengoku-tools.pin has no tengoku-isnad --haves (bump tengoku-tools.pin past the waypoints PR)"; exit 1
          fi
          (cd .tengoku && python3 ../tools/calibration/run_isnad.py --modules ../export-modules.txt --names-meta ../meta.tsv --out ../haves.txt --failed ../haves-failed.txt --jobs 1 --batch 5 --timeout 900 --exe "$TOOLS/.lake/build/bin/tengoku-isnad" --extra-arg=--haves --prefix isnad1-have)
          complete=""; [ -s haves-failed.txt ] || complete="--assume-complete"
          python3 tools/calibration/waypoints.py closures.jsonl haves.txt --isnad-py "$TOOLS/scripts/isnad.py" $complete > closures-wp.jsonl
      - name: Label with both axes, calibrate (the owner's delegated labels override the rules), summarise
        run: |
          python3 tools/calibration/label.py --input closures-wp.jsonl > labels-wp.jsonl
          python3 tools/calibration/thresholds.py labels-wp.jsonl --human calibration/human.jsonl > thresholds-wp.json
          cat thresholds-wp.json
          python3 tools/calibration/summary.py labels-wp.jsonl --stats groups-stats.json --tags-read "$(python3 tools/calibration/groups.py tags < dup.json)" | tee summary-wp.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration-wp
          path: |
            closures-wp.jsonl
            labels-wp.jsonl
            thresholds-wp.json
            summary-wp.md
            haves.txt
            haves-failed.txt
          retention-days: 30
