          # the extension entries of Tengoku's constants (ext_rows of the export run), split by the layer that holds each constant: a layer reads the rows it needs, not all of them
          if [ -s "$RUNNER_TEMP/ext.jsonl" ]; then python3 tools/promote/ext_partition.py "$RUNNER_TEMP/ext.jsonl" --layers "$RUNNER_TEMP/layers" --out "$RUNNER_TEMP/ext" | tee -a "$GITHUB_STEP_SUMMARY"; fi
