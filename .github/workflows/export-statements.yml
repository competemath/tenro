          rm -f "$RUNNER_TEMP/snapshot.tar"
          zst_sha="$(sha256sum "$RUNNER_TEMP/snapshot.tar.zst" | cut -d' ' -f1)"
          python3 tools/release/pack.py verify "$RUNNER_TEMP/snapshot.tar.zst" --sha256 "$zst_sha" --into "$RUNNER_TEMP/unpacked" > "$RUNNER_TEMP/verify.json"
