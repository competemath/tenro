# The candidates of a held-out selection (docs/heldout-selection.md): for each library read at tengoku.pin, the isnad records, the dependencies of each theorem, and where the dependencies outside the library live,
# joined by tools/campaign/candidates.py into candidates.jsonl. Manual: it reads whole libraries. It measures; it changes nothing.
# Dates: this workflow writes none (the Tengoku intake date is not the date a theorem was published, and would let an old theorem pass as post-cutoff); `date` is null until the upstream-date step supplies --dates.
name: candidates
on:
  workflow_dispatch:
    inputs:
      libraries:
        description: "Space-separated library directories under Tengoku/ (e.g. 'Aintlib Compfiles Azurite')"
        required: true
        default: "Aintlib"
permissions: {}
concurrency:
  group: candidates
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  LIBS: ${{ inputs.libraries }}
  GH_TOKEN: ${{ github.token }}
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: { contents: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: tengoku-isnad and the scripts at tengoku-tools.pin
        run: |
          pin="$(tr -d '[:space:]' < tengoku-tools.pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "tengoku-tools.pin must hold a full 40-character commit"; exit 1; }
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku "$RUNNER_TEMP/tengoku-tools"
          cd "$RUNNER_TEMP/tengoku-tools"
          git sparse-checkout set --no-cone '/TengokuIsnad.lean' '/scripts/' '/lakefile.toml' '/lean-toolchain' '/tools/isnad/'
          git checkout -q "$pin"
          lake build tengoku-isnad 2>&1 | tail -3
          echo "TOOLS=$RUNNER_TEMP/tengoku-tools" >> "$GITHUB_ENV"
      - name: The modules of the library
        run: |
          test -d ".tengoku/Tengoku/$LIB"
          { echo "Tengoku.$LIB"; (cd .tengoku && find "Tengoku/$LIB" -name '*.lean' | sed 's#\.lean$##; s#/#.#g' | sort); } | sort -u > "$RUNNER_TEMP/modules.txt"
          test -f ".tengoku/Tengoku/$LIB.lean" || sed -i "/^Tengoku\.$LIB\$/d" "$RUNNER_TEMP/modules.txt"
          wc -l "$RUNNER_TEMP/modules.txt"
      - name: Each library - records, dependencies, where the outside dependencies live
        working-directory: .tengoku
        run: |
          args=()
          for LIB in $LIBS; do
            [[ "$LIB" =~ ^[A-Za-z0-9_]+$ ]] || { echo "not a library name: $LIB"; exit 1; }
            test -d "Tengoku/$LIB"
            { echo "Tengoku.$LIB"; find "Tengoku/$LIB" -name '*.lean' | sed 's#\.lean$##; s#/#.#g' | sort; } | sort -u > "$RUNNER_TEMP/$LIB.modules"
            test -f "Tengoku/$LIB.lean" || sed -i "/^Tengoku\.$LIB\$/d" "$RUNNER_TEMP/$LIB.modules"
            python3 ../tools/calibration/run_isnad.py --modules "$RUNNER_TEMP/$LIB.modules" --out "$RUNNER_TEMP/$LIB.isnad.tsv" --failed "$RUNNER_TEMP/$LIB.failed" --jobs 2 --exe "$TOOLS/.lake/build/bin/tengoku-isnad"
            python3 ../tools/calibration/run_isnad.py --modules "$RUNNER_TEMP/$LIB.modules" --out "$RUNNER_TEMP/$LIB.deps.tsv" --failed "$RUNNER_TEMP/$LIB.deps-failed" --jobs 2 --exe "$TOOLS/.lake/build/bin/tengoku-isnad" --extra-arg --deps --prefix isnad1-deps
            # every dependency name that is not a theorem of the library: those are the ones whose module is looked up
            python3 - "$RUNNER_TEMP/$LIB.isnad.tsv" "$RUNNER_TEMP/$LIB.deps.tsv" > "$RUNNER_TEMP/$LIB.names" <<'PY'
          import sys
          own = {l.split("\t")[1] for l in open(sys.argv[1], encoding="utf-8") if l.startswith("isnad1\t")}
          out = set()
          for l in open(sys.argv[2], encoding="utf-8"):
              p = l.rstrip("\n").split("\t")
              if p[0] == "isnad1-deps":
                  out.update(d for d in p[3:] if d not in own)
          print("\n".join(sorted(out)))
          PY
            lake env lean --run "$GITHUB_WORKSPACE/tools/campaign/DepModules.lean" "$RUNNER_TEMP/$LIB.names" Tengoku.All > "$RUNNER_TEMP/$LIB.depmod.tsv"
            args+=(--library "$LIB" "$RUNNER_TEMP/$LIB.isnad.tsv" "$RUNNER_TEMP/$LIB.deps.tsv" "$RUNNER_TEMP/$LIB.depmod.tsv")
            wc -l "$RUNNER_TEMP/$LIB.isnad.tsv" "$RUNNER_TEMP/$LIB.deps.tsv" "$RUNNER_TEMP/$LIB.depmod.tsv" "$RUNNER_TEMP/$LIB.failed"
          done
          python3 ../tools/campaign/candidates.py --isnad-py "$TOOLS/scripts/isnad.py" "${args[@]}" --out "$RUNNER_TEMP/candidates.jsonl" | tee "$RUNNER_TEMP/candidates-summary.json"
      - name: Summary
        run: |
          { echo "## candidates for: $LIBS (tengoku.pin $(tr -d '[:space:]' < tengoku.pin | cut -c1-12))"; echo '```json'; cat "$RUNNER_TEMP/candidates-summary.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidates
          path: |
            ${{ runner.temp }}/candidates.jsonl
            ${{ runner.temp }}/candidates-summary.json
            ${{ runner.temp }}/*.failed
          retention-days: 30
