          pk = json.load(open(f"{t}/pack.json", encoding="utf-8"))
          idx = json.load(open(f"{t}/indexes/layers-stats.json", encoding="utf-8"))
          checks = int(open(f"{t}/check-count.txt", encoding="utf-8").read())  # the names the session `#check`ed (a count of " : " in its output would count the binders of the types too)
          zst = os.path.getsize(f"{t}/snapshot.tar.zst")
          zst_sha = open(f"{t}/zstd-sha256.txt", encoding="utf-8").read().split()[0]
          print("### The statements snapshot")
          print()
          print(f"* {m['totals']['theorems']:,} theorems of {len(m['libraries'])} libraries in {len(m['layers'])} layers; {m['totals']['constants_added']:,} constants added; olean bytes {m['totals']['olean_bytes']:,}; **refused by the kernel: {m['totals']['refused']}**")
          print(f"* the layers index places {idx['placed']:,} of {idx['theorems']:,} theorems ({idx['unplaced']:,} unplaced; {idx['in_foundation']:,} statements are in the foundation)")
          print(f"* the tar: {pk['modules']} oleans + the manifest + {len(m['indexes']['files'])} index files; zstd -19 --long=27: {zst:,} bytes ({zst / 1e6:,.0f} MB), sha256 `{zst_sha}`")
          print(f"* `pack.py verify` of the .zst: passed (every olean has the sha256 and the size of the manifest, every index file too); a session from the unpacked copy imported its layers and `#check`ed {checks} theorems: no error")
          att = m.get("attribution")
          if att:
              print(f"* attribution: {len(att['libraries'])} libraries from their repositories at a commit; licences {att['licences']}; **without a licence: {len(att['unknown'])}** {att['unknown'][:10]}")
