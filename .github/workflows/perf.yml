# The import-latency numbers of Tengai (core/), for the performance gate: cold `import Tengai` and the cost of one more module (tools/perf/perf_profile.py).
# Measured on the GitHub-hosted ubuntu-latest image; the numbers travel with the run (artifact + step summary). Nothing is gated until perf-budget.toml exists.
name: perf
on:
  pull_request:
    paths: ["tools/perf/**", ".github/workflows/perf.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the core
        working-directory: core
        run: lake build Tengai 2>&1 | tail -3
      - name: Cold import of Tengai
        working-directory: core
        run: python3 ../tools/perf/perf_profile.py load --module Tengai --root . --runs 9 | tee ../load.json
      - name: The cost of one more module (synthetic libraries of 0, 200 and 800 one-theorem modules)
        working-directory: core
        run: python3 ../tools/perf/perf_profile.py scale --sizes 0,200,800 --runs 7 | tee ../scale.json
      - name: Summary
        run: |
          {
            echo '### Import latency (ubuntu-latest, fresh process per run)'
            echo '```json'
            cat load.json scale.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: perf, path: "load.json\nscale.json", retention-days: 90 }
