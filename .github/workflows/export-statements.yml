          python3 - <<'PY'
          import json, os, re
          t = os.environ["RUNNER_TEMP"]
          rows = [json.loads(ln) for ln in open(f"{t}/indexes/layers.jsonl", encoding="utf-8")]
          simple = re.compile(r"^[A-Za-z_][A-Za-z0-9_']*(\.[A-Za-z_][A-Za-z0-9_']*)*$")
          by_layer: dict[str, list[str]] = {}
