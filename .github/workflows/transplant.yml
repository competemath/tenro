# The transplant measurement (ADR-0005): a seeded sample of theorems of one Tengoku library is exported with its whole closure (lean4export), replayed through the kernel by
# tengai-replay (core/, tengai v0.0.9) into a built .olean, and the cold-import time of that module is measured against an empty one. Manual. It measures; it changes nothing.
name: transplant
on:
  workflow_dispatch:
    inputs:
      library:
        description: "Library directory under Tengoku/ (e.g. Aintlib); with candidates_run, several separated by spaces"
        required: true
        default: "Aintlib"
      extensions:
        description: "Carry the extension entries (reducibility, classes, instances, projection info) from Tengoku into the built module (two replay passes: the first finds what was added, tengai-extinfo reads it in Tengoku, the second applies it)"
        required: true
        default: "true"
      layers:
        description: "Also promote by layers (a foundation and one layer per library of the sample, tools/promote/layers.py, tengai-replay --import/--only) and measure what a session loads: needs extensions=true and a candidates run"
        required: false
        default: "false"
      candidates_run:
        description: "Run id of a `candidates` run whose artifact lists the theorems (several libraries, no isnad pass). Empty: sample one library by an isnad pass."
        required: false
        default: ""
      manifests:
        description: "Sample the intake manifests of the pinned Tengoku (data/intake/<library>/manifest.jsonl) instead: many libraries, no candidates run and no isnad pass, so no source statement ids (the ids are counted, not compared). `library` then holds intake library keys (aintlib compfiles ...) or `all`"
        required: false
        default: "false"
      count:
        description: "How many theorems to transplant"
        required: true
        default: "30"
      seed:
        description: "Sample seed"
        required: true
        default: "transplant-1"
permissions: {}
concurrency:
  group: transplant
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  LIB: ${{ inputs.library }}
  CAND_RUN: ${{ inputs.candidates_run }}
  MANIFESTS: ${{ inputs.manifests }}
  EXTENSIONS: ${{ inputs.extensions }}
  LAYERS: ${{ inputs.layers }}
  COUNT: ${{ inputs.count }}
  SEED: ${{ inputs.seed }}
  LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c  # pragma: allowlist secret (a commit, not a secret): the commit Tengoku's independent check pins for toolchain v4.34.0-rc2
  NANODA_COMMIT: 3a2407216ee84a75f9e1aead6803d0578be06ae7  # pragma: allowlist secret (a commit, not a secret): the checker Tengoku's independent check pins (reads export format 3.1)
  GH_TOKEN: ${{ github.token }}
jobs:
  transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions: { contents: read, actions: read }
    steps:
      - name: Free disk (Tengoku's compiled cache is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tengoku at the pin, with its compiled cache
        run: scripts/tengoku-setup.sh
      - name: tengoku-isnad and the scripts at tengoku-tools.pin
        run: |
          pin="$(tr -d '[:space:]' < tengoku-tools.pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "tengoku-tools.pin must hold a full 40-character commit"; exit 1; }
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku "$RUNNER_TEMP/tengoku-tools"
          cd "$RUNNER_TEMP/tengoku-tools"
          git sparse-checkout set --no-cone '/TengokuIsnad.lean' '/scripts/' '/lakefile.toml' '/lean-toolchain' '/tools/isnad/'
          git checkout -q "$pin"
          lake build tengoku-isnad 2>&1 | tail -3
          echo "TOOLS=$RUNNER_TEMP/tengoku-tools" >> "$GITHUB_ENV"
      - name: A seeded sample (from the intake manifests, or a candidates run over several libraries, or one library by an isnad pass)
        run: |
          [[ "$COUNT" =~ ^[0-9]+$ ]] || { echo "bad count"; exit 1; }
          for l in $LIB; do [[ "$l" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad library $l"; exit 1; }; done
          if [ "$MANIFESTS" = true ]; then
            test -d .tengoku/data/intake
            python3 tools/promote/pick.py --manifests .tengoku/data/intake --libraries "$LIB" --n "$COUNT" --seed "$SEED" --names "$RUNNER_TEMP/names.txt" --modules "$RUNNER_TEMP/export-modules.txt" --sample "$RUNNER_TEMP/sample.jsonl"
          elif [ -n "$CAND_RUN" ]; then
            [[ "$CAND_RUN" =~ ^[0-9]+$ ]] || { echo "bad run id"; exit 1; }
            mkdir -p "$RUNNER_TEMP/cand"
            gh run download "$CAND_RUN" --repo "$GITHUB_REPOSITORY" -n candidates -D "$RUNNER_TEMP/cand"
            python3 tools/promote/pick.py --candidates "$RUNNER_TEMP/cand/candidates.jsonl" --libraries "$LIB" --n "$COUNT" --seed "$SEED" --names "$RUNNER_TEMP/names.txt" --modules "$RUNNER_TEMP/export-modules.txt" --sample "$RUNNER_TEMP/sample.jsonl"
          else
            test -d ".tengoku/Tengoku/$LIB"
            { echo "Tengoku.$LIB"; (cd .tengoku && find "Tengoku/$LIB" -name '*.lean' | sed 's#\.lean$##; s#/#.#g' | sort); } | sort -u > "$RUNNER_TEMP/lib.modules"
            test -f ".tengoku/Tengoku/$LIB.lean" || sed -i "/^Tengoku\.$LIB\$/d" "$RUNNER_TEMP/lib.modules"
            (cd .tengoku && python3 ../tools/calibration/run_isnad.py --modules "$RUNNER_TEMP/lib.modules" --out "$RUNNER_TEMP/isnad.tsv" --failed "$RUNNER_TEMP/isnad-failed.txt" --jobs 2 --exe "$TOOLS/.lake/build/bin/tengoku-isnad")
            python3 tools/promote/pick.py "$RUNNER_TEMP/isnad.tsv" --n "$COUNT" --seed "$SEED" --names "$RUNNER_TEMP/names.txt" --modules "$RUNNER_TEMP/export-modules.txt"
          fi
      - name: lean4export at the pinned commit
        run: |
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          cd "$RUNNER_TEMP/lean4export" && lake build 2>&1 | tail -3
      - name: Export the closure of the sample
        working-directory: .tengoku
        run: |
          mapfile -t mods < "$RUNNER_TEMP/export-modules.txt"
          mapfile -t names < "$RUNNER_TEMP/names.txt"
          lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "${mods[@]}" -- "${names[@]}" > "$RUNNER_TEMP/sample.ndjson"
          wc -lc "$RUNNER_TEMP/sample.ndjson"
      - name: "Layers: the plan (which layer each constant of the sample belongs to)"
        if: env.LAYERS == 'true'
        continue-on-error: true   # the planner reads a 2 GB export in Python: if it fails, the one-module pipeline below still runs and the layer steps say why they cannot
        run: |
          [ "$EXTENSIONS" = true ] && [ -s "$RUNNER_TEMP/sample.jsonl" ] || { echo "::error::layers needs extensions=true and a candidates run (the libraries of the sample are its topics)"; exit 1; }
          python3 - <<'PY'
          import json, os
          t = os.environ["RUNNER_TEMP"]
          topics: dict[str, list[str]] = {}
          for ln in open(f"{t}/sample.jsonl"):
              if ln.strip():
                  r = json.loads(ln)
                  topics.setdefault(r["library"], []).append(r["name"])
          json.dump(topics, open(f"{t}/topics.json", "w"))
          print("topics:", {k: len(v) for k, v in topics.items()})
          PY
          python3 tools/promote/layers.py "$RUNNER_TEMP/sample.ndjson" --topics "$RUNNER_TEMP/topics.json" --out "$RUNNER_TEMP/layers" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/layers/layers.json"
      - name: tengai-replay from core/ (kernel replay into Lean core alone, then the extension entries put back)
        run: |
          (cd core && lake build tengai-replay tengai-extinfo tengai-typeinfo 2>&1 | tail -3)
          mkdir -p "$RUNNER_TEMP/out"
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          ext_args=()
          if [ "$EXTENSIONS" = true ]; then
            # pass 1 only finds which constants were added (its module is thrown away); the extension entries of exactly those are read in Tengoku's environment
            mkdir -p "$RUNNER_TEMP/out1"
            "$replay" "$RUNNER_TEMP/sample.ndjson" --module TengaiData.Sample --out "$RUNNER_TEMP/out1" --added "$RUNNER_TEMP/added.jsonl" > /dev/null
            wc -l "$RUNNER_TEMP/added.jsonl"
            (cd .tengoku && lake env "$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-extinfo" "$RUNNER_TEMP/added.jsonl" Tengoku.All) > "$RUNNER_TEMP/ext.jsonl" 2> "$RUNNER_TEMP/extinfo.err"
            tail -1 "$RUNNER_TEMP/extinfo.err"
            wc -l "$RUNNER_TEMP/ext.jsonl"
            rm -rf "$RUNNER_TEMP/out1"
            ext_args=(--ext "$RUNNER_TEMP/ext.jsonl")
          fi
          if ! /usr/bin/time -v "$replay" "$RUNNER_TEMP/sample.ndjson" --module TengaiData.Sample --out "$RUNNER_TEMP/out" "${ext_args[@]}" 2> "$RUNNER_TEMP/replay-time.txt" | tee "$RUNNER_TEMP/replay-stats.json"; then
            echo "--- tengai-replay stderr (the reason) ---"; grep -v "^\s" "$RUNNER_TEMP/replay-time.txt" | head -60; exit 1
          fi
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/replay-time.txt"
          ls -l "$RUNNER_TEMP/out/TengaiData/Sample.olean"
      - name: The cold import, against an empty module, and the axioms of the sample
        run: |
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/out:$core_path"
          printf 'import Init\n' > "$RUNNER_TEMP/empty.lean"
          { printf 'import TengaiData.Sample\n'; while read -r n; do printf '#print axioms %s\n' "$n"; done < "$RUNNER_TEMP/names.txt"; } > "$RUNNER_TEMP/check.lean"
          python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/empty.lean" | tee "$RUNNER_TEMP/import-empty.json"
          # the import alone: a file with nothing else in it (the axiom printing below does real work per theorem and is not part of the load)
          printf 'import TengaiData.Sample\n' > "$RUNNER_TEMP/import-only.lean"
          python3 ../tools/promote/import_time.py --runs 7 -- lake env lean "$RUNNER_TEMP/import-only.lean" | tee "$RUNNER_TEMP/import-sample.json"
          lake env lean "$RUNNER_TEMP/check.lean" > "$RUNNER_TEMP/axioms.txt"
          head -4 "$RUNNER_TEMP/axioms.txt"
      - name: Instances found in the built module (informational - what a prover on a concrete goal needs)
        run: |
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/out:$core_path"
          printf 'import TengaiData.Sample\n#synth Field Real\n#synth CommRing Int\n#synth Monoid Nat\n#synth Group (Equiv.Perm Nat)\n' > "$RUNNER_TEMP/synth.lean"
          lake env lean "$RUNNER_TEMP/synth.lean" > "$RUNNER_TEMP/synth.txt" 2>&1 || true
          head -20 "$RUNNER_TEMP/synth.txt"
      - name: "The statements are the statements (the promotion lens: isnad ids of the replayed theorems against Tengoku's)"
        run: |
          core_path="$(cd "$TOOLS" && lake env printenv LEAN_PATH)"
          (cd "$TOOLS" && LEAN_PATH="$RUNNER_TEMP/out:$core_path" "$TOOLS/.lake/build/bin/tengoku-isnad" --module TengaiData.Sample) > "$RUNNER_TEMP/isnad-replayed.tsv" 2> "$RUNNER_TEMP/isnad-replayed.err" || true
          # tengoku-isnad reads every constant of the module, Mathlib's private numbered names included, and panics (non-fatally) on those it cannot name: counted, not hidden
          echo "isnad panics on unnameable constants: $(grep -c PANIC "$RUNNER_TEMP/isnad-replayed.err" || true)"
          wc -l "$RUNNER_TEMP/isnad-replayed.tsv"
          if [ -s "$RUNNER_TEMP/sample.jsonl" ]; then src=(--source-jsonl "$RUNNER_TEMP/sample.jsonl"); else src=(--source "$RUNNER_TEMP/isnad.tsv"); fi
          python3 tools/promote/compare_ids.py --isnad-py "$TOOLS/scripts/isnad.py" --names "$RUNNER_TEMP/names.txt" "${src[@]}" --replayed "$RUNNER_TEMP/isnad-replayed.tsv" --out "$RUNNER_TEMP/statement-ids.json" || echo "statement ids differ" > "$RUNNER_TEMP/statement-ids.failed"
      - name: "Where a statement that drifted differs (its type, read in Tengoku's environment and in the replayed module)"
        run: |
          # compare_ids reports a statement whose id differs only in its size class or hypothesis count as drift; this says which part of the expression differs (tools/promote/typeinfo_diff.py). A diagnosis: it fails nothing.
          python3 - <<'PY'
          import json, os
          rep = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "statement-ids.json")))
          names = [r["name"] for r in rep.get("drift", []) + rep.get("different", [])][:40]
          open(os.path.join(os.environ["RUNNER_TEMP"], "drift-names.jsonl"), "w").write("".join(json.dumps(n.split(".")) + "\n" for n in names))
          print(f"{len(names)} statement(s) to read")
          PY
          if [ -s "$RUNNER_TEMP/drift-names.jsonl" ]; then
            typeinfo="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-typeinfo"
            (cd .tengoku && lake env "$typeinfo" "$RUNNER_TEMP/drift-names.jsonl" Tengoku.All) > "$RUNNER_TEMP/typeinfo-source.jsonl"
            core_path="$(cd core && lake env printenv LEAN_PATH)"
            LEAN_PATH="$RUNNER_TEMP/out:$core_path" "$typeinfo" "$RUNNER_TEMP/drift-names.jsonl" TengaiData.Sample > "$RUNNER_TEMP/typeinfo-replayed.jsonl"
            python3 tools/promote/typeinfo_diff.py "$RUNNER_TEMP/typeinfo-source.jsonl" "$RUNNER_TEMP/typeinfo-replayed.jsonl" --out "$RUNNER_TEMP/typeinfo-diff.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: The built module checked again by nanoda (an independent checker, shares no code with Lean; invariant I1)
        run: |
          git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout -q "$NANODA_COMMIT"
          (cd "$RUNNER_TEMP/nanoda" && cargo build --release --locked 2>&1 | tail -2)
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/out:$core_path"
          # the replayed module read back out of its .olean: what is checked is the built artifact, not the export it came from
          lake env "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" TengaiData.Sample > "$RUNNER_TEMP/replayed.ndjson"
          wc -lc "$RUNNER_TEMP/replayed.ndjson"
          # the export holds all of Lean core, which declares sorryAx and the compiler axioms (as in Tengoku's nightly): nanoda admits them; what the SAMPLE depends on is checked separately, theorem by theorem
          cat > "$RUNNER_TEMP/nanoda.json" <<JSON
          {
            "export_file_path": "$RUNNER_TEMP/replayed.ndjson",
            "use_stdin": false,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "sorryAx", "Lean.ofReduceBool", "Lean.ofReduceNat", "Lean.trustCompiler"],
            "unpermitted_axiom_hard_error": true,
            "num_threads": 4,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true,
            "pp_to_stdout": true
          }
          JSON
          nanoda="$RUNNER_TEMP/nanoda/target/release/nanoda_bin"
          sed "s|$RUNNER_TEMP/replayed.ndjson|$RUNNER_TEMP/nanoda/test_resources/Empty/export|" "$RUNNER_TEMP/nanoda.json" > "$RUNNER_TEMP/nanoda-selftest.json"
          "$nanoda" "$RUNNER_TEMP/nanoda-selftest.json"
          if /usr/bin/time -v "$nanoda" "$RUNNER_TEMP/nanoda.json" > "$RUNNER_TEMP/nanoda.out" 2> "$RUNNER_TEMP/nanoda-time.txt"; then echo ok > "$RUNNER_TEMP/nanoda.status"; else echo FAILED > "$RUNNER_TEMP/nanoda.status"; fi
          tail -3 "$RUNNER_TEMP/nanoda.out"
          if [ "$(cat "$RUNNER_TEMP/nanoda.status")" != ok ]; then echo "--- nanoda stderr (the reason) ---"; head -60 "$RUNNER_TEMP/nanoda-time.txt"; fi
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/nanoda-time.txt" || true
      - name: The record of this transplant (manifest) and the compressed size of what it built
        run: |
          zstd -T0 -3 -q -c "$RUNNER_TEMP/out/TengaiData/Sample.olean" | wc -c | tee "$RUNNER_TEMP/olean-zstd-bytes.txt"
          python3 tools/promote/manifest.py --dir "$RUNNER_TEMP" --out "$RUNNER_TEMP/manifest.json" --export "$RUNNER_TEMP/sample.ndjson" --olean "$RUNNER_TEMP/out/TengaiData/Sample.olean" \
            --pin "tengoku=$(tr -d '[:space:]' < tengoku.pin)" --pin "core_tag=$(python3 -c 'import json;print(json.load(open("core.lock"))["tag"])')" --pin "lean4export=$LEAN4EXPORT_COMMIT" --pin "nanoda=$NANODA_COMMIT" \
            --pin "candidates_run=${CAND_RUN:-none}" --pin "seed=$SEED" --pin "count=$COUNT"
          python3 -c 'import json;m=json.load(open("'"$RUNNER_TEMP"'/manifest.json"));o=m["artifact"]["olean"];print("olean",o["bytes"],"gzip",o["gzip_bytes"])'
      - name: The snapshot - packed, compressed, unpacked and verified again, and imported from the unpacked copy
        run: |
          python3 tools/release/pack.py pack --olean-dir "$RUNNER_TEMP/out" --manifest "$RUNNER_TEMP/manifest.json" --out "$RUNNER_TEMP/snapshot.tar"
          zstd -T0 -12 --long=27 -q -f "$RUNNER_TEMP/snapshot.tar" -o "$RUNNER_TEMP/snapshot.tar.zst"
          sum="$(sha256sum "$RUNNER_TEMP/snapshot.tar.zst" | cut -d' ' -f1)"
          echo "$sum  snapshot.tar.zst" > "$RUNNER_TEMP/snapshot.sha256"
          ls -l "$RUNNER_TEMP/snapshot.tar.zst"
          python3 tools/release/pack.py verify "$RUNNER_TEMP/snapshot.tar.zst" --sha256 "$sum" --into "$RUNNER_TEMP/unpacked"
          # what a prover environment does with it: the unpacked directory on LEAN_PATH, one import
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$RUNNER_TEMP/unpacked:$core_path" lake env lean "$RUNNER_TEMP/import-only.lean"
          echo "the snapshot imports from its unpacked copy"
      - name: Summary
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          t = os.environ["RUNNER_TEMP"]
          raw = json.loads(open(f"{t}/replay-stats.json").read().strip().splitlines()[-1])
          stats = raw.get("replay", raw)
          print(f"extension entries carried: {raw.get('ext')}")
          print("instances in the built module: " + " | ".join(ln.strip()[:90] for ln in open(f"{t}/synth.txt").read().splitlines()[:6]))
          empty = json.load(open(f"{t}/import-empty.json"))
          sample = json.load(open(f"{t}/import-sample.json"))
          olean = os.path.getsize(f"{t}/out/TengaiData/Sample.olean")
          export = os.path.getsize(f"{t}/sample.ndjson")
          print("## transplant of a sample of " + os.environ["LIB"] + (f" (candidates run {os.environ['CAND_RUN']})" if os.environ.get("CAND_RUN") else ""))
          print(f"theorems {os.environ['COUNT']}, seed {os.environ['SEED']}; constants added {stats['added']}, already in Lean core {stats['skipped']}, inductive groups {stats['inductives']}")
          zst = int(open(f"{t}/olean-zstd-bytes.txt").read().split()[0])
          snap = os.path.getsize(f"{t}/snapshot.tar.zst")
          print(f"export {export/1e6:.1f} MB; olean {olean/1e6:.1f} MB (zstd -3: {zst/1e6:.1f} MB); snapshot (tar + manifest, zstd -12 --long): {snap/1e6:.1f} MB, sha256 {open(f'{t}/snapshot.sha256').read().split()[0][:16]}")
          m = json.load(open(f"{t}/manifest.json"))
          print(f"libraries in the sample: {', '.join(m['libraries']) or 'one library by isnad'}; gzip -6: {m['artifact']['olean']['gzip_bytes']/1e6:.1f} MB")
          ids = json.load(open(f"{t}/statement-ids.json"))
          print(f"statement ids (promotion lens): {ids['equal']} of {ids['names']} equal, {len(ids.get('drift', []))} drift (same hash, other hypothesis count or size class), {len(ids['different'])} different, {len(ids['missing_in_replayed'])} missing in the replayed module" + (f", {ids['no_source_id']} without a source id (a manifest sample)" if ids.get("no_source_id") else ""))
          import re
          checked = re.findall(r"Checked (\d+) declarations with no errors", open(f"{t}/nanoda.out").read())
          print(f"independent check (nanoda): {open(f'{t}/nanoda.status').read().strip()}; " + (f"{checked[-1]} declarations checked" if checked else "no success line"))
          print(f"cold import (median of {len(sample['runs'])}): empty module {empty['median']} s, with the sample {sample['median']} s (net {sample['median']-empty['median']:.3f} s); cap C_load 0.25 s")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transplant-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/names.txt
            ${{ runner.temp }}/replay-stats.json
            ${{ runner.temp }}/synth.txt
            ${{ runner.temp }}/ext.jsonl
            ${{ runner.temp }}/replay-time.txt
            ${{ runner.temp }}/import-empty.json
            ${{ runner.temp }}/import-sample.json
            ${{ runner.temp }}/nanoda.out
            ${{ runner.temp }}/nanoda-time.txt
            ${{ runner.temp }}/nanoda.status
            ${{ runner.temp }}/statement-ids.json
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/snapshot.tar.zst
            ${{ runner.temp }}/snapshot.sha256
            ${{ runner.temp }}/sample.jsonl
            ${{ runner.temp }}/axioms.txt
          retention-days: 14
      - name: The independent check, the statement ids and the axioms must have passed
        run: |
          test "$(cat "$RUNNER_TEMP/nanoda.status")" = ok
          test ! -e "$RUNNER_TEMP/statement-ids.failed"
          python3 - <<'PY'
          import os, re
          t = os.environ["RUNNER_TEMP"]
          names = [n for n in open(f"{t}/names.txt").read().split() if n]
          text = open(f"{t}/axioms.txt").read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          seen = set()
          for m in re.finditer(r"'(.+?)'\s+(depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)", text, re.S):
              seen.add(m.group(1).strip())
              used = {a.strip() for a in (m.group(3) or "").replace("\n", " ").split(",") if a.strip()}
              assert used <= allowed, f"{m.group(1)} depends on {sorted(used - allowed)}"
          assert seen == set(names), f"axioms printed for {len(seen)} of {len(names)} theorems"
          print(f"axioms: {len(names)} theorems, all within {sorted(allowed)}")
          PY

      # ----- by layers (ADR-0005, "Layers"): the same sample promoted as a foundation and a layer per library, and what a session loads of it. Added after the one-module pipeline above, which it does not touch.
      - name: "Layers: tengai-replay by layers (the foundation first, then each topic, each kernel-checked on its own)"
        if: env.LAYERS == 'true'
        run: |
          [ -s "$RUNNER_TEMP/layers/layers.json" ] || { echo "::error::the plan of the layers failed (its step above says why)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/layered"
          export LEAN_PATH="$RUNNER_TEMP/layered"
          replay="$GITHUB_WORKSPACE/core/.lake/build/bin/tengai-replay"
          python3 - <<'PY' > "$RUNNER_TEMP/layer-order.txt"
          import json, os
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "layers", "layers.json")))
          for layer in p["layers"]:
              print(layer["module"], layer["file"], *layer["imports"])
          PY
          : > "$RUNNER_TEMP/layer-stats.jsonl"
          while read -r module file imports; do
            read -r -a wanted <<< "$imports"
            args=(); for m in "${wanted[@]}"; do args+=(--import "$m"); done
            /usr/bin/time -v "$replay" "$RUNNER_TEMP/sample.ndjson" --module "$module" --out "$RUNNER_TEMP/layered" --only "$RUNNER_TEMP/layers/$file" --ext "$RUNNER_TEMP/ext.jsonl" "${args[@]}" 2> "$RUNNER_TEMP/layer-time.txt" | tee -a "$RUNNER_TEMP/layer-stats.jsonl"
            echo "$module: $(grep -E 'Elapsed' "$RUNNER_TEMP/layer-time.txt")"
          done < "$RUNNER_TEMP/layer-order.txt"
          find "$RUNNER_TEMP/layered" -name '*.olean' -printf '%s %P\n' | sort -k2
      - name: "Layers: what a session loads (the cold import of the foundation, of each topic, of everything, and of the one module; paired rounds, see tools/promote/import_time.py)"
        if: env.LAYERS == 'true'
        run: |
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          printf 'import Init\n' > "$RUNNER_TEMP/l-empty.lean"
          python3 - <<'PY' > "$RUNNER_TEMP/l-sets.txt"
          import json, os
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "layers", "layers.json")))
          for layer in p["layers"]:
              print(layer["module"].removeprefix("TengaiData.").replace(".", "_"), layer["module"])  # Foundation, Topic_Aintlib, ...: one label each, even for a topic called foundation
          print("All", *[x["module"] for x in p["layers"]])
          PY
          args=(--runs 9 --baseline "lake env lean $RUNNER_TEMP/l-empty.lean")
          while read -r label modules; do
            read -r -a wanted <<< "$modules"
            : > "$RUNNER_TEMP/l-$label.lean"; for m in "${wanted[@]}"; do printf 'import %s\n' "$m" >> "$RUNNER_TEMP/l-$label.lean"; done
            args+=(--target "$label=lake env lean $RUNNER_TEMP/l-$label.lean")
          done < "$RUNNER_TEMP/l-sets.txt"
          printf 'import TengaiData.Sample\n' > "$RUNNER_TEMP/l-Sample.lean"
          args+=(--target "OneModule=lake env lean $RUNNER_TEMP/l-Sample.lean")
          # the layers and the one module are different modules: one search path holds both, and every command runs in every round
          LEAN_PATH="$RUNNER_TEMP/layered:$RUNNER_TEMP/out:$core_path" python3 ../tools/promote/import_time.py compare "${args[@]}" > "$RUNNER_TEMP/l-compare.json"
          cd ..
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/layers-load.md"
          import json, os, subprocess
          t = os.environ["RUNNER_TEMP"]
          p = json.load(open(f"{t}/layers/layers.json"))
          size = {}
          for layer in p["layers"]:
              path = f"{t}/layered/" + layer["module"].replace(".", "/") + ".olean"
              size[layer["module"]] = os.path.getsize(path)
          mono = os.path.getsize(f"{t}/out/TengaiData/Sample.olean")
          cmp = json.load(open(f"{t}/l-compare.json"))
          empty = cmp["baseline"]
          print("## what a session loads, layered against one module")
          print("| imports | olean bytes loaded (MB) | cold import, median (s) | net over an empty module, paired median (s) | net, fastest runs (s) |")
          print("|---|---|---|---|---|")
          rows = []
          for line in open(f"{t}/l-sets.txt"):
              label, *mods = line.split()
              loaded = set()
              for m in mods:
                  loaded.add(m)
                  loaded.update(next(x for x in p["layers"] if x["module"] == m)["imports"])
              rows.append((label, sum(size[m] for m in loaded) / 1e6, cmp[label]))
          rows.append(("TengaiData.Sample (one module)", mono / 1e6, cmp["OneModule"]))
          for label, mb, r in rows:
              print(f"| {label} | {mb:.1f} | {r['median']} | {r['net_median']:.3f} | {r['net_min']:.3f} |")
          print(f"\nan empty module: median {empty['median']} s, fastest {empty['min']} s ({len(cmp['runs']['baseline'])} paired rounds); cap C_load 0.25 s")
          zs = {}
          for layer in p["layers"]:
              path = f"{t}/layered/" + layer["module"].replace(".", "/") + ".olean"
              zs[layer["module"]] = int(subprocess.run(f"zstd -3 -c {path} | wc -c", shell=True, capture_output=True, text=True).stdout.split()[0])
          print("\nzstd -3 of each layer (MB): " + ", ".join(f"{m.split('.')[-1]} {v / 1e6:.1f}" for m, v in zs.items()))
          json.dump({"rows": [[label, mb, r] for label, mb, r in rows], "empty": empty, "olean": size, "zstd3": zs, "one_module": mono}, open(f"{t}/layers-load.json", "w"))
          PY
      - name: "Layers: the same statements (isnad ids of every layer against Tengoku's)"
        if: env.LAYERS == 'true'
        run: |
          core_path="$(cd "$TOOLS" && lake env printenv LEAN_PATH)"
          : > "$RUNNER_TEMP/isnad-layers.tsv"; : > "$RUNNER_TEMP/isnad-layers.err"
          while read -r module _; do
            (cd "$TOOLS" && LEAN_PATH="$RUNNER_TEMP/layered:$core_path" "$TOOLS/.lake/build/bin/tengoku-isnad" --module "$module") >> "$RUNNER_TEMP/isnad-layers.tsv" 2>> "$RUNNER_TEMP/isnad-layers.err" || true
          done < "$RUNNER_TEMP/layer-order.txt"
          wc -l "$RUNNER_TEMP/isnad-layers.tsv"
          python3 tools/promote/compare_ids.py --isnad-py "$TOOLS/scripts/isnad.py" --names "$RUNNER_TEMP/names.txt" --source-jsonl "$RUNNER_TEMP/sample.jsonl" --replayed "$RUNNER_TEMP/isnad-layers.tsv" --out "$RUNNER_TEMP/statement-ids-layers.json" | tee -a "$GITHUB_STEP_SUMMARY" || echo "statement ids of the layers differ"
      - name: "Layers: every theorem resolves from the layers and rests on the standard axioms only"
        if: env.LAYERS == 'true'
        run: |
          cd core
          core_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$RUNNER_TEMP/layered:$core_path"
          { while read -r module _; do printf 'import %s\n' "$module"; done < "$RUNNER_TEMP/layer-order.txt"; while read -r n; do printf '#print axioms %s\n' "$n"; done < "$RUNNER_TEMP/names.txt"; } > "$RUNNER_TEMP/layers-check.lean"
          lake env lean "$RUNNER_TEMP/layers-check.lean" > "$RUNNER_TEMP/layers-axioms.txt"
          python3 - <<'PY'
          import os, re
          t = os.environ["RUNNER_TEMP"]
          names = [n for n in open(f"{t}/names.txt").read().split() if n]
          text = open(f"{t}/layers-axioms.txt").read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          seen = set()
          for m in re.finditer(r"'(.+?)'\s+(depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)", text, re.S):
              seen.add(m.group(1).strip())
              used = {a.strip() for a in (m.group(3) or "").replace("\n", " ").split(",") if a.strip()}
              assert used <= allowed, f"{m.group(1)} depends on {sorted(used - allowed)}"
          assert seen == set(names), f"axioms printed for {len(seen)} of {len(names)} theorems"
          print(f"layers: {len(names)} theorems resolve, all within {sorted(allowed)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.LAYERS == 'true'
        with:
          name: transplant-layers-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/layers/layers.json
            ${{ runner.temp }}/layer-stats.jsonl
            ${{ runner.temp }}/layers-load.json
            ${{ runner.temp }}/layers-load.md
            ${{ runner.temp }}/statement-ids-layers.json
            ${{ runner.temp }}/layers-axioms.txt
          retention-days: 14
